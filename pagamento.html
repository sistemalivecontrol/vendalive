<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - VendaLive</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0B193F;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(91, 155, 213, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(11, 25, 63, 0.8) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(91, 155, 213, 0.05) 0%, transparent 60%);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
        }
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .logo h1 {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }
        .logo h1 span { color: #5b9bd5; }
        .logo p {
            color: rgba(255,255,255,0.45);
            font-size: 13px;
            margin-top: 4px;
        }

        .plano-info {
            background: rgba(91, 155, 213, 0.1);
            border: 1px solid rgba(91, 155, 213, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        .plano-info .nome {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .plano-info .preco {
            color: #5b9bd5;
            font-size: 36px;
            font-weight: 800;
        }
        .plano-info .preco span {
            font-size: 16px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
        }
        .plano-info .desc {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 8px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #5b9bd5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        .error-state {
            text-align: center;
            padding: 20px;
        }
        .error-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .error-state h3 {
            color: #f87171;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .error-state p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .success-state {
            text-align: center;
            padding: 20px;
        }
        .success-state .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }
        .success-state h3 {
            color: #4ade80;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .success-state p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .payment-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: white;
        }
        .payment-option:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(91, 155, 213, 0.3);
            transform: translateY(-1px);
        }
        .payment-option .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(91, 155, 213, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .payment-option .info {
            flex: 1;
            text-align: left;
        }
        .payment-option .info .nome {
            font-weight: 600;
            font-size: 15px;
            color: white;
            margin-bottom: 2px;
        }
        .payment-option .info .desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .payment-option .arrow {
            color: rgba(255,255,255,0.3);
            font-size: 18px;
        }

        .pix-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        .pix-section h4 {
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
        }
        .pix-qr {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: inline-block;
        }
        .pix-qr img {
            width: 200px;
            height: 200px;
        }
        .pix-code {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            word-break: break-all;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pix-code:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(91, 155, 213, 0.3);
        }
        .btn-copiar {
            padding: 10px 20px;
            background: #5b9bd5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-copiar:hover {
            background: #4a8bc4;
        }
        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-voltar:hover { color: #5b9bd5; }

        .info-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .info-box p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            line-height: 1.6;
        }
        .info-box p strong {
            color: white;
        }

        .debug-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,200,0,0.2);
            border-radius: 10px;
            padding: 12px;
            margin-top: 16px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            font-family: monospace;
            word-break: break-all;
        }

        .modo-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .modo-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modo-btn.active {
            background: rgba(91, 155, 213, 0.2);
            border-color: #5b9bd5;
            color: white;
        }

        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="./img/logo-livecontrol.png" alt="VendaLive">
                <h1>Venda<span>Live</span></h1>
                <p>Ative sua conta para começar a usar</p>
            </div>

            <div class="modo-toggle">
                <button class="modo-btn active" onclick="setModo('edge')" id="btnModoEdge">Via Supabase (Seguro)</button>
                <button class="modo-btn" onclick="setModo('proxy')" id="btnModoProxy">Via Proxy (Teste)</button>
            </div>

            <div id="conteudo">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Gerando sua cobrança...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const SUPABASE_URL = 'https://aqrvozmxlcgrllclceke.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxcnZvem14bGNncmxsY2xjZWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNTk0MDEsImV4cCI6MjA5MTgzNTQwMX0.6CL3-1dU6WUT4EbJ0UfvmLFj6jGPnT9Avc743WrNiCA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ASAAS_API_KEY = 'aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OmVhN2YyZDA3LWQyMjQtNGNmYy1iNzQ5LWJkNjdhZWIyM2UzMDo6JGFhY2hfZmFkN2I5MzctODJlOC00OGIzLThlMjYtZmY4NzhlYzI4MmI3';
        const ASAAS_BASE_URL = 'https://api-sandbox.asaas.com/v3';
        const WALLET_ID = '0692dded-12f2-4d9c-a2ac-4c9dac28d3ab';

        // Proxy CORS público para testes (alternativa temporária)
        const CORS_PROXY = 'https://corsproxy.io/?';

        const PLANOS = {
            basic: { nome: 'Basic', valor: 80.00, desc: 'Até 3 usuários · Suporte por e-mail' },
            premium: { nome: 'Premium', valor: 100.00, desc: 'Usuários ilimitados · Suporte prioritário' }
        };

        let MODO_ATUAL = 'edge'; // 'edge' = Supabase Edge Function, 'proxy' = Proxy CORS
        const dadosCadastro = JSON.parse(localStorage.getItem('cadastroPendente') || '{}');
        const conteudo = document.getElementById('conteudo');

        function setModo(modo) {
            MODO_ATUAL = modo;
            document.getElementById('btnModoEdge').classList.toggle('active', modo === 'edge');
            document.getElementById('btnModoProxy').classList.toggle('active', modo === 'proxy');
            gerarCobranca();
        }

        async function gerarCobranca() {
            console.log('[PAGAMENTO] Iniciando... Modo:', MODO_ATUAL);
            console.log('[PAGAMENTO] Dados cadastro:', dadosCadastro);

            if (!dadosCadastro.cliente_id) {
                mostrarErro('Dados do cadastro não encontrados. Por favor, faça o cadastro novamente.');
                return;
            }

            const plano = dadosCadastro.plano || 'basic';
            const p = PLANOS[plano];

            conteudo.innerHTML = `
                <div class="plano-info">
                    <div class="nome">Plano ${p.nome}</div>
                    <div class="preco">R$ ${p.valor.toFixed(2).replace('.', ',')}<span>/mês</span></div>
                    <div class="desc">${p.desc}</div>
                </div>
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>${MODO_ATUAL === 'edge' ? 'Chamando Supabase Edge Function...' : 'Chamando via Proxy CORS...'}</p>
                </div>
            `;

            try {
                let result;

                if (MODO_ATUAL === 'edge') {
                    result = await chamarEdgeFunction(dadosCadastro, p);
                } else {
                    result = await chamarViaProxy(dadosCadastro, p);
                }

                if (!result.success) {
                    throw new Error(result.error || 'Erro desconhecido');
                }

                // Salvar no localStorage
                localStorage.setItem('pagamentoPendente', JSON.stringify({
                    ...result,
                    plano: plano,
                    cliente_id: dadosCadastro.cliente_id
                }));

                // Atualizar Supabase com asaas_customer_id
                if (result.asaas_customer_id) {
                    const { error } = await supabaseClient
                        .from('clientes_sistema')
                        .update({
                            asaas_customer_id: result.asaas_customer_id,
                            asaas_subscription_id: result.asaas_subscription_id,
                            status_pagamento: 'pendente'
                        })
                        .eq('id', dadosCadastro.cliente_id);

                    if (error) console.error('[PAGAMENTO] Erro Supabase:', error);
                }

                mostrarOpcoesPagamento(result, p);

            } catch (error) {
                console.error('[PAGAMENTO] ❌ ERRO:', error);
                mostrarErro('Erro ao gerar cobrança: ' + error.message, error);
            }
        }

        // MODO 1: Via Edge Function do Supabase (recomendado, seguro)
        async function chamarEdgeFunction(dados, plano) {
            console.log('[PAGAMENTO] Chamando Edge Function...');

            const response = await fetch(`${SUPABASE_URL}/functions/v1/asaas-criar-assinatura`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                    nome: dados.nome_empresa || dados.nome_responsavel,
                    email: dados.email,
                    cpfCnpj: dados.cnpj,
                    telefone: dados.telefone,
                    plano: dados.plano,
                    cliente_id: dados.cliente_id
                })
            });

            const result = await response.json();
            console.log('[PAGAMENTO] Resposta Edge Function:', response.status, result);

            if (!response.ok) {
                throw new Error(result.error || `HTTP ${response.status}`);
            }

            return result;
        }

        // MODO 2: Via Proxy CORS público (para teste imediato)
        async function chamarViaProxy(dados, plano) {
            console.log('[PAGAMENTO] Chamando via Proxy CORS...');

            // 1. Criar cliente
            const customerPayload = {
                name: dados.nome_empresa || dados.nome_responsavel || 'Cliente VendaLive',
                email: dados.email,
                cpfCnpj: dados.cnpj ? dados.cnpj.replace(/\D/g, '') : undefined,
                phone: dados.telefone ? dados.telefone.replace(/\D/g, '') : undefined,
                notificationDisabled: false,
                walletId: WALLET_ID
            };
            Object.keys(customerPayload).forEach(k => {
                if (customerPayload[k] === undefined) delete customerPayload[k];
            });

            const customerRes = await fetch(CORS_PROXY + encodeURIComponent(`${ASAAS_BASE_URL}/customers`), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'access_token': ASAAS_API_KEY,
                    'User-Agent': 'VendaLive/1.0'
                },
                body: JSON.stringify(customerPayload)
            });

            const customerData = await customerRes.json();
            console.log('[PAGAMENTO] Proxy - Cliente:', customerRes.status, customerData);

            if (!customerRes.ok) {
                throw new Error(`Cliente: ${customerData.errors?.[0]?.description || customerData.message}`);
            }

            const asaasCustomerId = customerData.id;

            // 2. Criar assinatura
            const hoje = new Date();
            const vencimento = new Date(hoje);
            vencimento.setDate(vencimento.getDate() + 7);

            const subscriptionRes = await fetch(CORS_PROXY + encodeURIComponent(`${ASAAS_BASE_URL}/subscriptions`), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'access_token': ASAAS_API_KEY,
                    'User-Agent': 'VendaLive/1.0'
                },
                body: JSON.stringify({
                    customer: asaasCustomerId,
                    billingType: 'UNDEFINED',
                    value: plano.valor,
                    nextDueDate: vencimento.toISOString().split('T')[0],
                    cycle: 'MONTHLY',
                    description: `VendaLive - Plano ${plano.nome}`,
                    walletId: WALLET_ID
                })
            });

            const subscriptionData = await subscriptionRes.json();
            if (!subscriptionRes.ok) {
                throw new Error(`Assinatura: ${subscriptionData.errors?.[0]?.description || subscriptionData.message}`);
            }

            const asaasSubscriptionId = subscriptionData.id;

            // 3. Criar cobrança
            const paymentRes = await fetch(CORS_PROXY + encodeURIComponent(`${ASAAS_BASE_URL}/payments`), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'access_token': ASAAS_API_KEY,
                    'User-Agent': 'VendaLive/1.0'
                },
                body: JSON.stringify({
                    customer: asaasCustomerId,
                    subscription: asaasSubscriptionId,
                    billingType: 'UNDEFINED',
                    value: plano.valor,
                    dueDate: vencimento.toISOString().split('T')[0],
                    description: `VendaLive - Plano ${plano.nome}`,
                    walletId: WALLET_ID
                })
            });

            const paymentData = await paymentRes.json();
            if (!paymentRes.ok) {
                throw new Error(`Cobrança: ${paymentData.errors?.[0]?.description || paymentData.message}`);
            }

            return {
                success: true,
                asaas_customer_id: asaasCustomerId,
                asaas_subscription_id: asaasSubscriptionId,
                asaas_payment_id: paymentData.id,
                invoice_url: paymentData.invoiceUrl,
                bank_slip_url: paymentData.bankSlipUrl,
                pix_qr_code: paymentData.pixQrCode,
                pix_payload: paymentData.pixPayload,
                valor: plano.valor,
                vencimento: vencimento.toISOString().split('T')[0]
            };
        }

        function mostrarOpcoesPagamento(dados, plano) {
            const vencimento = new Date(dados.vencimento || Date.now());

            conteudo.innerHTML = `
                <div class="plano-info">
                    <div class="nome">Plano ${plano.nome}</div>
                    <div class="preco">R$ ${plano.valor.toFixed(2).replace('.', ',')}<span>/mês</span></div>
                    <div class="desc">Vencimento: ${vencimento.toLocaleDateString('pt-BR')}</div>
                </div>
                <div class="info-box">
                    <p>Escolha como deseja pagar sua mensalidade. Após o pagamento, sua conta será ativada automaticamente.</p>
                </div>
                <div class="payment-options">
                    <a href="${dados.invoice_url}" target="_blank" class="payment-option">
                        <div class="icon">💳</div>
                        <div class="info">
                            <div class="nome">Cartão de Crédito</div>
                            <div class="desc">Pagamento recorrente automático</div>
                        </div>
                        <div class="arrow">›</div>
                    </a>
                    <a href="${dados.bank_slip_url || dados.invoice_url}" target="_blank" class="payment-option">
                        <div class="icon">📄</div>
                        <div class="info">
                            <div class="nome">Boleto Bancário</div>
                            <div class="desc">Vencimento em ${vencimento.toLocaleDateString('pt-BR')}</div>
                        </div>
                        <div class="arrow">›</div>
                    </a>
                    ${dados.pix_qr_code ? `
                    <div class="payment-option" onclick="mostrarPIX()" style="cursor:pointer">
                        <div class="icon">⚡</div>
                        <div class="info">
                            <div class="nome">PIX</div>
                            <div class="desc">Pagamento instantâneo com QR Code</div>
                        </div>
                        <div class="arrow">›</div>
                    </div>
                    ` : ''}
                </div>
                <a href="cadastro.html" class="btn-voltar">← Voltar para cadastro</a>
            `;
        }

        function mostrarPIX() {
            const pagamento = JSON.parse(localStorage.getItem('pagamentoPendente') || '{}');
            if (!pagamento.pix_qr_code) return;

            conteudo.innerHTML = `
                <div class="success-state">
                    <div class="icon">⚡</div>
                    <h3>Pagamento via PIX</h3>
                    <p>Escaneie o QR Code ou copie o código PIX para pagar</p>
                </div>
                <div class="pix-section">
                    <h4>QR Code PIX</h4>
                    <div class="pix-qr">
                        <img src="data:image/png;base64,${pagamento.pix_qr_code}" alt="QR Code PIX">
                    </div>
                    <div class="pix-code" onclick="copiarPIX()" title="Clique para copiar">
                        ${pagamento.pix_payload || 'Código PIX não disponível'}
                    </div>
                    <button class="btn-copiar" onclick="copiarPIX()">📋 Copiar Código PIX</button>
                </div>
                <div class="info-box">
                    <p><strong>Importante:</strong> Após o pagamento, aguarde alguns minutos para a confirmação automática. Você receberá um e-mail quando sua conta for ativada.</p>
                </div>
                <a href="login.html" class="btn-voltar">→ Já paguei? Ir para Login</a>
            `;
        }

        function copiarPIX() {
            const pagamento = JSON.parse(localStorage.getItem('pagamentoPendente') || '{}');
            if (pagamento.pix_payload) {
                navigator.clipboard.writeText(pagamento.pix_payload).then(() => {
                    alert('✅ Código PIX copiado! Abra seu app bancário e cole o código.');
                });
            }
        }

        function mostrarErro(mensagem, errorDetails) {
            let debugInfo = '';
            if (errorDetails && typeof errorDetails === 'object') {
                debugInfo = `
                    <div class="debug-box">
                        <strong>Debug:</strong><br>
                        ${JSON.stringify(errorDetails, null, 2).substring(0, 500)}
                    </div>
                `;
            }

            conteudo.innerHTML = `
                <div class="error-state">
                    <div class="icon">⚠️</div>
                    <h3>Ops! Algo deu errado</h3>
                    <p>${mensagem}</p>
                    <button onclick="gerarCobranca()" class="btn-copiar">🔄 Tentar Novamente</button>

            `;
