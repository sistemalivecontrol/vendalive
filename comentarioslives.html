<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendaLive - Comentários de Lives</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo {
            width: 45px; height: 45px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .header-title { color: white; font-size: 22px; font-weight: 700; }
        .header-subtitle { color: rgba(255,255,255,0.8); font-size: 13px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .btn-voltar {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-voltar:hover { background: rgba(255,255,255,0.3); }
        .user-info { color: white; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 25px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 18px; font-weight: 700; color: #1a1a2e;
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .card-title i { color: #667eea; }

        /* Stats Cards */
        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .stat-card {
            background: white; border-radius: 16px; padding: 20px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .stat-value { font-size: 32px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 13px; color: #6c757d; margin-top: 5px; }

        /* Lives Grid */
        .lives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .live-card {
            background: #f8f9fa; border-radius: 16px; overflow: hidden;
            border: 1px solid #e9ecef;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .live-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .live-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px; color: white;
        }
        .live-status {
            display: inline-block; padding: 4px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
        }
        .live-status.disponivel { background: #28a745; }
        .live-status.expirada { background: #dc3545; }
        .live-status.importada { background: #17a2b8; }
        .live-date { font-size: 14px; margin-top: 8px; opacity: 0.9; }
        .live-info { padding: 20px; }
        .live-stats { display: flex; gap: 20px; margin-bottom: 15px; }
        .live-stat { text-align: center; }
        .live-stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
        .live-stat-label { font-size: 12px; color: #6c757d; }
        .live-actions { display: flex; gap: 10px; }
        .btn-action {
            flex: 1; padding: 10px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .btn-importar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-importar:hover { opacity: 0.9; }
        .btn-importar:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ver {
            background: #e9ecef; color: #495057;
        }
        .btn-ver:hover { background: #dee2e6; }
        .btn-exportar {
            background: #28a745; color: white;
        }
        .btn-exportar:hover { background: #218838; }

        /* Import Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 20px; width: 100%;
            max-width: 800px; max-height: 90vh; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .modal-header {
            padding: 20px 25px; border-bottom: 1px solid #e9ecef;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { font-size: 18px; color: #1a1a2e; }
        .modal-close { background: none; border: none; font-size: 24px; color: #6c757d; cursor: pointer; }
        .modal-body { padding: 20px 25px; overflow-y: auto; flex: 1; }

        /* Sugestões de Lives */
        .sugestoes-section { margin-bottom: 20px; }
        .sugestoes-title { font-size: 14px; color: #6c757d; margin-bottom: 10px; }
        .sugestao-item {
            background: #f8f9fa; border-radius: 10px; padding: 12px 15px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.3s;
            display: flex; justify-content: space-between; align-items: center;
            border: 2px solid transparent;
        }
        .sugestao-item:hover { border-color: #667eea; background: #e7eaff; }
        .sugestao-item.selecionado { border-color: #667eea; background: #e7eaff; }
        .sugestao-info { display: flex; align-items: center; gap: 10px; }
        .sugestao-icon { font-size: 20px; }
        .sugestao-text { font-size: 14px; color: #1a1a2e; }
        .sugestao-data { font-size: 12px; color: #6c757d; }

        /* Input Manual */
        .input-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e9ecef; }
        .input-label { font-size: 14px; color: #495057; margin-bottom: 8px; display: block; }
        .input-field {
            width: 100%; padding: 12px; border: 1px solid #ced4da;
            border-radius: 8px; font-size: 14px; margin-bottom: 10px;
        }
        .btn-buscar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; padding: 12px 30px;
            border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-buscar:hover { opacity: 0.9; }
        .btn-buscar:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Comentários Table */
        .comentarios-table { width: 100%; border-collapse: collapse; }
        .comentarios-table th, .comentarios-table td {
            padding: 12px; text-align: left; border-bottom: 1px solid #e9ecef;
        }
        .comentarios-table th {
            background: #f8f9fa; font-size: 13px; font-weight: 600; color: #495057;
        }
        .comentarios-table td { font-size: 14px; color: #333; }
        .comentario-user { font-weight: 600; color: #667eea; }
        .comentario-texto { color: #495057; }
        .comentario-produto {
            display: inline-block; background: #e7eaff; color: #667eea;
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
        }
        .comentario-tipo {
            display: inline-block; padding: 4px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .tipo-venda { background: #d4edda; color: #155724; }
        .tipo-interesse { background: #fff3cd; color: #856404; }
        .tipo-duvida { background: #d1ecf1; color: #0c5460; }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: #6c757d; }
        .loading i { font-size: 40px; animation: spin 1s linear infinite; color: #667eea; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Alert */
        .alert {
            padding: 15px 20px; border-radius: 10px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }

        /* Hidden */
        .hidden { display: none !important; }

        /* Filters */
        .filters-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 20px; border-radius: 20px; border: 2px solid #e9ecef;
            background: white; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; color: #495057;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-color: transparent;
        }
        .filter-btn:hover { border-color: #667eea; }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state i { font-size: 60px; margin-bottom: 20px; color: #dee2e6; }
        .empty-state h3 { font-size: 20px; color: #495057; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .header-title { font-size: 18px; }
            .container { padding: 15px; }
            .lives-grid { grid-template-columns: 1fr; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-logo">📺</div>
            <div>
                <div class="header-title">VendaLive</div>
                <div class="header-subtitle">Comentários de Lives</div>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info" id="userInfo">
                <i class="fas fa-user"></i>
                <span id="userName">Carregando...</span>
            </div>
            <button class="btn-voltar" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
        </div>
    </div>

    <div class="container">
        <div id="alertContainer"></div>

        <!-- Stats Section -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="statTotalLives">0</div>
                <div class="stat-label">Lives Importadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTotalComentarios">0</div>
                <div class="stat-label">Comentários</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTotalVendas">0</div>
                <div class="stat-label">Vendas Detectadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTotalInteresses">0</div>
                <div class="stat-label">Interesses</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="card-title" style="margin-bottom: 0;">
                    <i class="fas fa-video"></i>
                    Lives do Instagram
                </div>
                <button class="btn-action btn-importar" onclick="abrirModalImportar()">
                    <i class="fas fa-download"></i> Importar Comentários
                </button>
            </div>
            <div id="livesContainer" class="lives-grid">
                <div class="loading" style="grid-column: 1/-1;">
                    <i class="fas fa-spinner"></i>
                    <p>Carregando lives...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-download"></i> Importar Comentários da Live</h3>
                <button class="modal-close" onclick="fecharModalImportar()">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Sugestões de Lives -->
                <div class="sugestoes-section" id="sugestoesSection">
                    <div class="sugestoes-title"><i class="fas fa-magic"></i> Lives recentes encontradas</div>
                    <div id="sugestoesContainer">
                        <div class="loading">
                            <i class="fas fa-spinner"></i>
                            <p>Buscando lives...</p>
                        </div>
                    </div>
                </div>

                <!-- Input Manual -->
                <div class="input-section">
                    <label class="input-label"><i class="fas fa-link"></i> Ou cole o link/ID da live manualmente</label>
                    <input type="text" class="input-field" id="liveUrlInput" placeholder="https://www.instagram.com/live/ABC123 ou ID da live">
                    <button class="btn-buscar" id="btnBuscarComentarios" onclick="buscarComentariosManual()">
                        <i class="fas fa-search"></i> Buscar Comentários
                    </button>
                </div>

                <!-- Resultados -->
                <div id="resultadosContainer" class="hidden" style="margin-top: 20px;">
                    <div class="sugestoes-title">Comentários encontrados</div>
                    <div id="comentariosResultado"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Comments Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal" style="max-width: 900px;">
            <div class="modal-header">
                <h3><i class="fas fa-comments"></i> Comentários da Live</h3>
                <button class="modal-close" onclick="fecharModalView()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="filters-bar" style="margin-bottom: 15px;">
                    <button class="filter-btn active" onclick="filtrarComentarios('todos', this)">Todos</button>
                    <button class="filter-btn" onclick="filtrarComentarios('venda', this)">Vendas</button>
                    <button class="filter-btn" onclick="filtrarComentarios('interesse', this)">Interesses</button>
                    <button class="filter-btn" onclick="filtrarComentarios('duvida', this)">Dúvidas</button>
                </div>
                <div id="comentariosViewContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aqrvozmxlcgrllclceke.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxcnZvem14bGNncmxsY2xjZWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNTk0MDEsImV4cCI6MjA5MTgzNTQwMX0.6CL3-1dU6WUT4EbJ0UfvmLFj6jGPnT9Avc743WrNiCA';

        let supabaseClient = null;
        let usuarioLogado = null;
        let clienteId = null;
        let instagramConfig = null;
        let livesData = [];
        let comentariosData = [];
        let liveSelecionada = null;

        // Palavras-chave para detectar produtos
        const PRODUTOS_KEYWORDS = [
            'conjunto', 'vestido', 'calça', 'calca', 'blusa', 'camisa', 'camiseta',
            'short', 'saia', 'casaco', 'jaqueta', 'moletom', 'pijama', 'roupa',
            'tamanho', 'tam', 'tamanho', 'numero', 'nº', 'n°',
            'menino', 'menina', 'bebe', 'bebê', 'infantil'
        ];

        const TIPOS_KEYWORDS = {
            venda: ['quero', 'comprei', 'vou querer', 'pego', 'levo', 'mando', 'pago', 'pix'],
            interesse: ['quanto', 'valor', 'preco', 'preço', 'tem ainda', 'disponivel', 'ainda tem'],
            duvida: ['mostra', 'qual', 'como', 'onde', 'quando', 'tamanho', 'cor']
        };

        document.addEventListener('DOMContentLoaded', async function() {
            console.log('[COMENTARIOS-LIVES] Iniciando...');

            let tentativas = 0;
            while (tentativas < 20) {
                if (typeof window.supabase !== 'undefined') break;
                await new Promise(r => setTimeout(r, 300));
                tentativas++;
            }

            if (typeof window.supabase === 'undefined') {
                mostrarAlerta('Erro ao carregar biblioteca. Recarregue a página.', 'error');
                return;
            }

            const { createClient } = window.supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            await verificarAutenticacao();
        });

        async function verificarAutenticacao() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }

                usuarioLogado = session.user;
                document.getElementById('userName').textContent = usuarioLogado.email;

                const { data: userData } = await supabaseClient
                    .from('usuarios_pg')
                    .select('cliente_id')
                    .eq('auth_id', usuarioLogado.id)
                    .single();

                if (userData && userData.cliente_id) {
                    clienteId = userData.cliente_id;
                } else {
                    clienteId = '0824668c-1e10-415e-8998-09d72ef47dcb';
                }

                console.log('[COMENTARIOS-LIVES] cliente_id:', clienteId);

                await carregarConfiguracaoInstagram();
                await carregarLivesImportadas();

            } catch (erro) {
                console.error('[COMENTARIOS-LIVES] Erro auth:', erro);
                window.location.href = 'login.html';
            }
        }

        async function carregarConfiguracaoInstagram() {
            try {
                const { data } = await supabaseClient
                    .from('configuracoes_pagamento')
                    .select('instagram_access_token, instagram_business_id, instagram_username')
                    .eq('cliente_id', clienteId)
                    .single();

                if (data && data.instagram_access_token) {
                    instagramConfig = {
                        accessToken: data.instagram_access_token,
                        instagramId: data.instagram_business_id,
                        username: data.instagram_username
                    };
                    console.log('[COMENTARIOS-LIVES] Instagram configurado:', instagramConfig.username);
                } else {
                    // Fallback localStorage
                    const local = localStorage.getItem('instagram_config_' + clienteId);
                    if (local) {
                        const parsed = JSON.parse(local);
                        instagramConfig = {
                            accessToken: parsed.instagram_access_token,
                            instagramId: parsed.instagram_business_id,
                            username: parsed.instagram_username
                        };
                    }
                }
            } catch (e) {
                console.log('[COMENTARIOS-LIVES] Sem config Instagram');
            }
        }

        async function carregarLivesImportadas() {
            try {
                const { data, error } = await supabaseClient
                    .from('lives_importadas')
                    .select('*')
                    .eq('cliente_id', clienteId)
                    .order('data_live', { ascending: false });

                if (error) throw error;

                livesData = data || [];
                renderizarLives(livesData);
                atualizarStats();

            } catch (error) {
                console.error('[COMENTARIOS-LIVES] Erro ao carregar lives:', error);
                // Fallback: mostrar vazio
                renderizarLives([]);
            }
        }

        function renderizarLives(lives) {
            const container = document.getElementById('livesContainer');

            if (lives.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i class="fas fa-video-slash"></i>
                        <h3>Nenhuma live importada</h3>
                        <p>Clique em "Importar Comentários" para buscar lives do seu Instagram.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = lives.map(live => {
                const dataLive = live.data_live ? new Date(live.data_live).toLocaleDateString('pt-BR') : 'Data desconhecida';
                const statusClass = live.status === 'importada' ? 'importada' : live.status === 'disponivel' ? 'disponivel' : 'expirada';
                const statusText = live.status === 'importada' ? 'Importada' : live.status === 'disponivel' ? 'Disponível' : 'Expirada';

                return `
                    <div class="live-card" data-id="${live.id}">
                        <div class="live-header">
                            <span class="live-status ${statusClass}">${statusText}</span>
                            <div class="live-date"><i class="fas fa-calendar"></i> ${dataLive}</div>
                        </div>
                        <div class="live-info">
                            <div class="live-stats">
                                <div class="live-stat">
                                    <div class="live-stat-value">${live.total_comentarios || 0}</div>
                                    <div class="live-stat-label">Comentários</div>
                                </div>
                                <div class="live-stat">
                                    <div class="live-stat-value">${live.total_vendas || 0}</div>
                                    <div class="live-stat-label">Vendas</div>
                                </div>
                                <div class="live-stat">
                                    <div class="live-stat-value">${live.total_interesses || 0}</div>
                                    <div class="live-stat-label">Interesses</div>
                                </div>
                            </div>
                            <div class="live-actions">
                                <button class="btn-action btn-ver" onclick="verComentariosLive('${live.id}')">
                                    <i class="fas fa-eye"></i> Ver
                                </button>
                                <button class="btn-action btn-exportar" onclick="exportarLive('${live.id}')">
                                    <i class="fas fa-file-excel"></i> Excel
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function atualizarStats() {
            const totalLives = livesData.length;
            const totalComentarios = livesData.reduce((sum, l) => sum + (l.total_comentarios || 0), 0);
            const totalVendas = livesData.reduce((sum, l) => sum + (l.total_vendas || 0), 0);
            const totalInteresses = livesData.reduce((sum, l) => sum + (l.total_interesses || 0), 0);

            document.getElementById('statTotalLives').textContent = totalLives;
            document.getElementById('statTotalComentarios').textContent = totalComentarios;
            document.getElementById('statTotalVendas').textContent = totalVendas;
            document.getElementById('statTotalInteresses').textContent = totalInteresses;
        }

        // ========================================
        // MODAL IMPORTAR
        // ========================================
        async function abrirModalImportar() {
            document.getElementById('importModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            // Limpar estado anterior
            document.getElementById('resultadosContainer').classList.add('hidden');
            document.getElementById('liveUrlInput').value = '';

            // Buscar sugestões de lives
            if (instagramConfig && instagramConfig.accessToken) {
                await buscarSugestoesLives();
            } else {
                document.getElementById('sugestoesContainer').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Instagram não conectado. Conecte sua conta em "Monitor Instagram" primeiro.
                    </div>
                `;
            }
        }

        function fecharModalImportar() {
            document.getElementById('importModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        async function buscarSugestoesLives() {
            const container = document.getElementById('sugestoesContainer');
            container.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Buscando lives recentes...</p>
                </div>
            `;

            try {
                // Buscar lives recentes via Instagram API
                // Nota: Instagram não tem endpoint específico para lives, mas podemos buscar stories/reels recentes
                // ou usar o endpoint de media para buscar vídeos recentes

                const url = `https://graph.facebook.com/v25.0/${instagramConfig.instagramId}/media?fields=id,caption,media_type,media_url,permalink,timestamp,comments_count&access_token=${instagramConfig.accessToken}&limit=20`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const lives = (data.data || []).filter(item => item.media_type === 'VIDEO');

                if (lives.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            Nenhuma live recente encontrada. Cole o link da live manualmente abaixo.
                        </div>
                    `;
                    return;
                }

                container.innerHTML = lives.map(live => {
                    const dataLive = live.timestamp ? new Date(live.timestamp).toLocaleDateString('pt-BR') : 'Data desconhecida';
                    const horaLive = live.timestamp ? new Date(live.timestamp).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : '';
                    const caption = live.caption ? live.caption.substring(0, 50) + (live.caption.length > 50 ? '...' : '') : 'Sem descrição';

                    return `
                        <div class="sugestao-item" onclick="selecionarLive('${live.id}', '${live.permalink || ''}')">
                            <div class="sugestao-info">
                                <span class="sugestao-icon">📺</span>
                                <div>
                                    <div class="sugestao-text">${caption}</div>
                                    <div class="sugestao-data"><i class="fas fa-calendar"></i> ${dataLive} ${horaLive} · <i class="fas fa-comment"></i> ${live.comments_count || 0} comentários</div>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right" style="color: #667eea;"></i>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('[COMENTARIOS-LIVES] Erro ao buscar sugestões:', error);
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        Não foi possível buscar lives automaticamente. Cole o link manualmente.
                    </div>
                `;
            }
        }

        function selecionarLive(mediaId, permalink) {
            // Marcar visualmente
            document.querySelectorAll('.sugestao-item').forEach(item => item.classList.remove('selecionado'));
            event.currentTarget.classList.add('selecionado');

            liveSelecionada = { mediaId, permalink };
            document.getElementById('liveUrlInput').value = permalink || mediaId;

            // Buscar comentários automaticamente
            buscarComentariosManual();
        }

        async function buscarComentariosManual() {
            const input = document.getElementById('liveUrlInput').value.trim();
            if (!input) {
                mostrarAlerta('Insira o link ou ID da live', 'error');
                return;
            }

            const btn = document.getElementById('btnBuscarComentarios');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Buscando...';

            try {
                // Extrair media ID do input
                let mediaId = input;
                if (input.includes('instagram.com')) {
                    // Tentar extrair ID da URL
                    const match = input.match(/\/([A-Za-z0-9_-]+)/);
                    if (match) mediaId = match[1];
                }

                // Se temos instagramConfig, buscar via API
                if (instagramConfig && instagramConfig.accessToken) {
                    await buscarComentariosViaAPI(mediaId);
                } else {
                    mostrarAlerta('Instagram não conectado. Conecte primeiro.', 'error');
                }

            } catch (error) {
                console.error('[COMENTARIOS-LIVES] Erro:', error);
                mostrarAlerta('Erro ao buscar comentários: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Buscar Comentários';
            }
        }

        async function buscarComentariosViaAPI(mediaId) {
            try {
                const url = `https://graph.facebook.com/v25.0/${mediaId}/comments?fields=id,text,username,timestamp,like_count&access_token=${instagramConfig.accessToken}&limit=1000`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                comentariosData = (data.data || []).map(comment => analisarComentario(comment));

                mostrarResultadosComentarios(comentariosData);
                mostrarAlerta(`${comentariosData.length} comentários encontrados!`, 'success');

                // Salvar no banco
                await salvarLiveImportada(mediaId, comentariosData);

            } catch (error) {
                throw error;
            }
        }

        function analisarComentario(comment) {
            const texto = (comment.text || '').toLowerCase();
            let tipo = 'duvida';
            let produto = null;

            // Detectar tipo
            if (TIPOS_KEYWORDS.venda.some(k => texto.includes(k))) tipo = 'venda';
            else if (TIPOS_KEYWORDS.interesse.some(k => texto.includes(k))) tipo = 'interesse';

            // Detectar produto (análise simples)
            for (const keyword of PRODUTOS_KEYWORDS) {
                if (texto.includes(keyword.toLowerCase())) {
                    // Extrair contexto do produto
                    const index = texto.indexOf(keyword.toLowerCase());
                    const start = Math.max(0, index - 20);
                    const end = Math.min(texto.length, index + keyword.length + 20);
                    produto = texto.substring(start, end).trim();
                    break;
                }
            }

            return {
                comment_id: comment.id,
                username: comment.username || 'usuario',
                texto: comment.text || '',
                tipo: tipo,
                produto: produto,
                timestamp: comment.timestamp,
                like_count: comment.like_count || 0
            };
        }

        function mostrarResultadosComentarios(comentarios) {
            const container = document.getElementById('resultadosContainer');
            const resultadoDiv = document.getElementById('comentariosResultado');

            if (comentarios.length === 0) {
                resultadoDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-slash"></i>
                        <p>Nenhum comentário encontrado nesta live.</p>
                    </div>
                `;
            } else {
                resultadoDiv.innerHTML = `
                    <table class="comentarios-table">
                        <thead>
                            <tr>
                                <th>Usuário</th>
                                <th>Comentário</th>
                                <th>Produto</th>
                                <th>Tipo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${comentarios.slice(0, 50).map(c => `
                                <tr>
                                    <td class="comentario-user">@${escapeHtml(c.username)}</td>
                                    <td class="comentario-texto">${escapeHtml(c.texto)}</td>
                                    <td>${c.produto ? `<span class="comentario-produto">${escapeHtml(c.produto)}</span>` : '-'}</td>
                                    <td><span class="comentario-tipo tipo-${c.tipo}">${c.tipo}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${comentarios.length > 50 ? `<p style="text-align: center; margin-top: 10px; color: #6c757d;">Mostrando 50 de ${comentarios.length} comentários</p>` : ''}
                `;
            }

            container.classList.remove('hidden');
        }

        async function salvarLiveImportada(mediaId, comentarios) {
            try {
                const totalVendas = comentarios.filter(c => c.tipo === 'venda').length;
                const totalInteresses = comentarios.filter(c => c.tipo === 'interesse').length;

                const liveData = {
                    cliente_id: clienteId,
                    media_id: mediaId,
                    data_live: new Date().toISOString(),
                    total_comentarios: comentarios.length,
                    total_vendas: totalVendas,
                    total_interesses: totalInteresses,
                    status: 'importada'
                };

                // Inserir live
                const { data: liveInsert, error: liveError } = await supabaseClient
                    .from('lives_importadas')
                    .insert(liveData)
                    .select()
                    .single();

                if (liveError) throw liveError;

                // Inserir comentários
                const comentariosToInsert = comentarios.map(c => ({
                    live_id: liveInsert.id,
                    cliente_id: clienteId,
                    comment_id: c.comment_id,
                    username: c.username,
                    texto: c.texto,
                    tipo: c.tipo,
                    produto: c.produto,
                    timestamp: c.timestamp
                }));

                const { error: comentariosError } = await supabaseClient
                    .from('live_comentarios')
                    .insert(comentariosToInsert);

                if (comentariosError) throw comentariosError;

                mostrarAlerta('Live e comentários salvos com sucesso!', 'success');
                await carregarLivesImportadas();

            } catch (error) {
                console.error('[COMENTARIOS-LIVES] Erro ao salvar:', error);
                mostrarAlerta('Erro ao salvar: ' + error.message, 'error');
            }
        }

        // ========================================
        // VER COMENTÁRIOS
        // ========================================
        async function verComentariosLive(liveId) {
            document.getElementById('viewModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            try {
                const { data, error } = await supabaseClient
                    .from('live_comentarios')
                    .select('*')
                    .eq('live_id', liveId)
                    .order('timestamp', { ascending: true });

                if (error) throw error;

                comentariosData = data || [];
                renderizarComentariosView(comentariosData);

            } catch (error) {
                document.getElementById('comentariosViewContainer').innerHTML = `
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        Erro ao carregar comentários: ${error.message}
                    </div>
                `;
            }
        }

        function renderizarComentariosView(comentarios) {
            const container = document.getElementById('comentariosViewContainer');

            if (comentarios.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-slash"></i>
                        <p>Nenhum comentário encontrado.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <table class="comentarios-table">
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Comentário</th>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${comentarios.map(c => {
                            const data = c.timestamp ? new Date(c.timestamp).toLocaleString('pt-BR') : '-';
                            return `
                                <tr>
                                    <td class="comentario-user">@${escapeHtml(c.username)}</td>
                                    <td class="comentario-texto">${escapeHtml(c.texto)}</td>
                                    <td>${c.produto ? `<span class="comentario-produto">${escapeHtml(c.produto)}</span>` : '-'}</td>
                                    <td><span class="comentario-tipo tipo-${c.tipo}">${c.tipo}</span></td>
                                    <td style="font-size: 12px; color: #6c757d;">${data}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function filtrarComentarios(filtro, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let filtrados = [...comentariosData];
            if (filtro !== 'todos') {
                filtrados = comentariosData.filter(c => c.tipo === filtro);
            }
            renderizarComentariosView(filtrados);
        }

        function fecharModalView() {
            document.getElementById('viewModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ========================================
        // EXPORTAR
        // ========================================
        async function exportarLive(liveId) {
            try {
                const { data, error } = await supabaseClient
                    .from('live_comentarios')
                    .select('*')
                    .eq('live_id', liveId)
                    .order('timestamp', { ascending: true });

                if (error) throw error;

                const comentarios = data || [];
                if (comentarios.length === 0) {
                    mostrarAlerta('Nenhum comentário para exportar', 'warning');
                    return;
                }

                // Criar CSV
                const csv = [
                    ['Usuário', 'Comentário', 'Produto', 'Tipo', 'Data'].join(';'),
                    ...comentarios.map(c => [
                        c.username,
                        c.texto,
                        c.produto || '',
                        c.tipo,
                        c.timestamp ? new Date(c.timestamp).toLocaleString('pt-BR') : ''
                    ].map(v => `"${(v || '').replace(/"/g, '""')}"`).join(';'))
                ].join('
');

                // Download
                const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `live_comentarios_${liveId}_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();

                mostrarAlerta('Relatório exportado com sucesso!', 'success');

            } catch (error) {
                mostrarAlerta('Erro ao exportar: ' + error.message, 'error');
            }
        }

        // ========================================
        // UTILITÁRIOS
        // ========================================
        function mostrarAlerta(mensagem, tipo) {
            const container = document.getElementById('alertContainer');
            const alertClass = tipo === 'success' ? 'alert-success' : tipo === 'error' ? 'alert-error' : tipo === 'warning' ? 'alert-warning' : 'alert-info';
            const icon = tipo === 'success' ? 'fa-check-circle' : tipo === 'error' ? 'fa-exclamation-circle' : tipo === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle';

            container.innerHTML = `
                <div class="alert ${alertClass}">
                    <i class="fas ${icon}"></i>
                    ${mensagem}
                </div>
            `;

            setTimeout(() => { container.innerHTML = ''; }, 5000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Fechar modais ao clicar fora
        document.getElementById('importModal').addEventListener('click', function(e) {
            if (e.target === this) fecharModalImportar();
        });
        document.getElementById('viewModal').addEventListener('click', function(e) {
            if (e.target === this) fecharModalView();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                fecharModalImportar();
                fecharModalView();
            }
        });
    </script>
</body>
