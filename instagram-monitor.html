<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendaLive - Conectando Instagram...</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128250;</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
        .container { text-align: center; padding: 40px; }
        .card { background: white; border-radius: 20px; padding: 50px 40px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { font-size: 60px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
        .subtitle { font-size: 16px; color: #6c757d; margin-bottom: 30px; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid #e9ecef; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-icon { font-size: 60px; color: #28a745; margin-bottom: 20px; }
        .error-icon { font-size: 60px; color: #dc3545; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 30px; border-radius: 10px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.3s; margin-top: 20px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary { background: #e9ecef; color: #495057; }
        .btn-secondary:hover { background: #dee2e6; }
        .status-message { font-size: 14px; color: #6c757d; margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px; }
        .status-message.error { background: #f8d7da; color: #721c24; }
        .status-message.success { background: #d4edda; color: #155724; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="card" id="cardContent">
            <div class="loading-spinner" id="spinner"></div>
            <div class="title" id="title">Conectando Instagram...</div>
            <div class="subtitle" id="subtitle">Aguarde enquanto processamos a autorização</div>
            <div class="status-message" id="statusMessage" style="display: none;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aqrvozmxlcgrllclceke.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxcnZvem14bGNncmxsY2xjZWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNTk0MDEsImV4cCI6MjA5MTgzNTQwMX0.6CL3-1dU6WUT4EbJ0UfvmLFj6jGPnT9Avc743WrNiCA';

        // Extrai parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');
        const spinnerEl = document.getElementById('spinner');
        const statusEl = document.getElementById('statusMessage');
        const cardEl = document.getElementById('cardContent');

        async function processarCallback() {
            // Se houve erro no OAuth
            if (error) {
                mostrarErro('Erro na autorização: ' + (errorDescription || error));
                return;
            }

            if (!code) {
                mostrarErro('Código de autorização não encontrado. Tente conectar novamente.');
                return;
            }

            try {
                // Chama a Edge Function para trocar o code por token
                const response = await fetch(SUPABASE_URL + '/functions/v1/instagram-callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || ''));
                const data = await response.json();

                if (data.success) {
                    mostrarSucesso(data.username, data.instagram_id);
                } else {
                    mostrarErro(data.error || 'Erro desconhecido ao conectar conta.');
                }
            } catch (e) {
                console.error('[INSTAGRAM-MONITOR] Erro:', e);
                mostrarErro('Erro ao processar conexão. Verifique sua conexão e tente novamente.');
            }
        }

        function mostrarSucesso(username, instagramId) {
            spinnerEl.style.display = 'none';
            cardEl.innerHTML = '<div class="success-icon">&#9989;</div>' +
                '<div class="title">Conta conectada!</div>' +
                '<div class="subtitle">@' + username + ' foi conectada com sucesso.</div>' +
                '<div class="status-message success">ID da conta: ' + instagramId + '</div>' +
                '<a href="comentarioslives.html" class="btn btn-primary">Ir para Comentários de Lives</a>' +
                '<br><a href="dashboard.html" class="btn btn-secondary" style="margin-top: 10px;">Voltar ao Dashboard</a>';

            // Notifica a janela pai (se aberto via popup)
            if (window.opener) {
                window.opener.postMessage({
                    type: 'instagram-oauth-success',
                    username: username,
                    instagram_id: instagramId
                }, '*');
            }
        }

        function mostrarErro(mensagem) {
            spinnerEl.style.display = 'none';
            cardEl.innerHTML = '<div class="error-icon">&#10060;</div>' +
                '<div class="title">Erro na conexão</div>' +
                '<div class="subtitle">Não foi possível conectar sua conta</div>' +
                '<div class="status-message error">' + mensagem + '</div>' +
                '<a href="comentarioslives.html" class="btn btn-primary">Tentar novamente</a>' +
                '<br><a href="dashboard.html" class="btn btn-secondary" style="margin-top: 10px;">Voltar ao Dashboard</a>';

            if (window.opener) {
                window.opener.postMessage({
                    type: 'instagram-oauth-error',
                    error: mensagem
                }, '*');
            }
        }

        // Inicia processamento
        processarCallback();
    </script>
</body>
</html>
