    <!-- Script de correcao dinamica apos React renderizar -->
    <script>
      // FORCAR links a abrir na MESMA aba (remove target="_blank")
      (function() {
        var observer = new MutationObserver(function() {
          document.querySelectorAll('a[target="_blank"]').forEach(function(a) {
            a.removeAttribute('target');
          });
        });
        observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      })();
      (function() {
        function fixLogo() {
          // Procura por todos os possiveis logos
          var selectors = [
            '.logo', '.brand', '.nav-logo', '.header-logo', '.site-logo', '.brand-name',
            '[class*="logo"]', '[class*="brand"]'
          ];

          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            elements.forEach(function(el) {
              // Forca estilos inline (mais especifico que CSS)
              el.style.overflow = 'visible';
              el.style.whiteSpace = 'nowrap';
              el.style.minWidth = 'max-content';
              el.style.maxWidth = 'none';
              el.style.width = 'auto';
              el.style.flexShrink = '0';
              el.style.textOverflow = 'clip';

              // Procura spans dentro do logo
              var spans = el.querySelectorAll('span');
              spans.forEach(function(span, index) {
                span.style.display = 'inline';
                span.style.whiteSpace = 'nowrap';
                span.style.overflow = 'visible';

                // Todos os spans brancos
                span.style.color = '#ffffff';
                span.style.fontWeight = '700';
              });

              // Forcar SVG do icone branco
              var svgElements = el.querySelectorAll('svg *');
              svgElements.forEach(function(el) {
                el.style.stroke = '#ffffff';
                el.style.fill = '#ffffff';
              });
              // Se o logo tiver SVG com texto
              var texts = el.querySelectorAll('text');
              texts.forEach(function(text, index) {
                text.style.fill = '#ffffff';
              });
            });
          });
        }

        // Executa apos carregamento
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixLogo);
        } else {
          fixLogo();
        }

        // Reexecuta apos 1s e 3s (React pode renderizar depois)
        setTimeout(fixLogo, 1000);
        setTimeout(fixLogo, 3000);

        // Observa mudancas no DOM (React re-renderiza)
        var observer = new MutationObserver(function(mutations) {
          fixLogo();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true
        });
      })();
    </script>
  
    <!-- ===== INTERCEPTAR BOTAO ENTRAR - MESMA ABA ===== -->
    <script>
      (function() {
        // Intercepta cliques em botoes/links de "Entrar" ou "Login"
        document.addEventListener('click', function(e) {
          var target = e.target;

          // Procura o elemento clicado ou seus pais que sejam botoes/links de login
          var el = target;
          while (el && el !== document.body) {
            var text = el.textContent || el.innerText || '';
            var href = el.getAttribute('href') || '';

            // Verifica se é botão de entrar/login
            if (text && (
                text.trim() === 'Entrar' || 
                text.trim() === 'Login' || 
                text.trim() === 'Acessar' ||
                text.trim() === 'Fazer Login' ||
                href.includes('login')
              )) {

              // Se tiver href para login.html, navega na mesma aba
              if (href && href.includes('login')) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = href;
                return false;
              }

              // Se for um botão que pode abrir em nova aba, previne
              if (el.target === '_blank' || el.getAttribute('target') === '_blank') {
                e.preventDefault();
                e.stopPropagation();
                el.removeAttribute('target');
                // Simula o clique novamente sem target
                el.click();
                return false;
              }
            }
            el = el.parentElement;
          }
        }, true); // useCapture = true para interceptar antes

        // Também observa mudanças no DOM para remover target="_blank" de links de login
        var observer = new MutationObserver(function(mutations) {
          document.querySelectorAll('a[href*="login"], button, [role="button"]').forEach(function(el) {
            var text = el.textContent || el.innerText || '';
            if (text.trim() === 'Entrar' || text.trim() === 'Login' || text.trim() === 'Acessar') {
              el.removeAttribute('target');
              // Adiciona onclick inline para garantir mesma aba
              if (!el.getAttribute('data-entrada-fix')) {
                el.setAttribute('data-entrada-fix', 'true');
                el.addEventListener('click', function(ev) {
                  if (this.tagName === 'A' && this.href) {
                    ev.preventDefault();
                    window.location.href = this.href;
                  }
                });
              }
            }
          });
        });

        observer.observe(document.body || document.documentElement, { 
          childList: true, 
          subtree: true 
        });
      })();
    </script>

    <!-- ===== INTERCEPTAR LINKS DOS PLANOS ===== -->
    <script>
      (function() {
        // Intercepta cliques nos botões "Escolher Plano Basic" e "Escolher Plano Premium"
        document.addEventListener('click', function(e) {
          var target = e.target;
          var el = target;

          // Procura o elemento clicado ou seus pais que sejam links de plano
          while (el && el !== document.body) {
            var text = (el.textContent || el.innerText || '').trim();
            var href = el.getAttribute('href') || '';

            // Detecta botão de plano Basic
            if (text === 'Escolher Plano Basic' || href.includes('Plano Basic')) {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = 'cadastro.html?plano=basic';
              return false;
            }

            // Detecta botão de plano Premium
            if (text === 'Escolher Plano Premium' || href.includes('Plano Premium')) {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = 'cadastro.html?plano=premium';
              return false;
            }

            el = el.parentElement;
          }
        }, true);

        // Também observa mudanças no DOM (React re-renderiza)
        var observer = new MutationObserver(function(mutations) {
          document.querySelectorAll('a[href*="Plano Basic"], a[href*="Plano Premium"]').forEach(function(el) {
            if (el.getAttribute('href').includes('Plano Basic')) {
              el.setAttribute('href', 'cadastro.html?plano=basic');
              el.removeAttribute('target');
              el.removeAttribute('rel');
            }
            if (el.getAttribute('href').includes('Plano Premium')) {
              el.setAttribute('href', 'cadastro.html?plano=premium');
              el.removeAttribute('target');
              el.removeAttribute('rel');
            }
          });
        });

        observer.observe(document.body || document.documentElement, { 
          childList: true, 
          subtree: true 
        });
      })();
    </script>
