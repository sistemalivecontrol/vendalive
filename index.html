<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VendaLive - Sistema de Gestao para Lives. Gerencie pedidos, clientes, cobrancas e entregas em tempo real." />
    <meta name="theme-color" content="#0a1628" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VendaLive - Sistema de Gestao para Lives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', system-ui, -apple-system, sans-serif; }</style>
    <script type="module" crossorigin src="./assets/index-DaOTygQi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3lEyXtq.css">
    <base target="_blank">

    <!-- CSS injetado dinamicamente como ultimo stylesheet -->
    <style id="logo-fix-final">
      /* Logo VendaLive - TUDO BRANCO - regras de precedencia maxima */
      .logo, [class*="logo"]:not([class*="container"]):not([class*="wrapper"]):not([class*="icon"]) {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0px !important;
        white-space: nowrap !important;
        overflow: visible !important;
        min-width: max-content !important;
        max-width: none !important;
        width: auto !important;
        flex-shrink: 0 !important;
        color: #ffffff !important;
      }
      .logo span, [class*="logo"] > span, .logo > span {
        display: inline !important;
        white-space: nowrap !important;
        overflow: visible !important;
        color: #ffffff !important;
      }
      .logo span:last-child,
      .logo span:nth-child(2),
      .logo .live, .logo .Live,
      .logo .highlight, .logo .accent,
      .logo [class*="live"], .logo [class*="Live"],
      .logo [class*="accent"], .logo [class*="highlight"],
      .logo [class*="yellow"], .logo [class*="amber"],
      .logo [class*="gold"], .logo [class*="primary"] {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
      .logo svg *, .logo svg path, .logo svg rect, .logo svg circle {
        stroke: #ffffff !important;
        fill: #ffffff !important;
      }
      .logo svg text { fill: #ffffff !important; }
      .header-left, .nav-left, [class*="header-left"], [class*="nav-left"] {
        overflow: visible !important;
        min-width: max-content !important;
      }
    </style>
</head>
  <body>
    <div id="root"></div>

    <!-- Script V3 - injeta CSS dinamicamente como ULTIMO stylesheet -->
    <script>
      (function() {
        'use strict';

        var cssRules = `
          .logo, [class*="logo"]:not([class*="container"]):not([class*="wrapper"]):not([class*="icon"]) {
            color: #ffffff !important;
            display: inline-flex !important;
            align-items: center !important;
            white-space: nowrap !important;
            overflow: visible !important;
            min-width: max-content !important;
          }
          .logo span, [class*="logo"] > span, .logo > span {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            display: inline !important;
            white-space: nowrap !important;
          }
          .logo span:last-child, .logo span:nth-child(2),
          .logo .live, .logo .Live, .logo .highlight, .logo .accent,
          .logo [class*="live"], .logo [class*="Live"],
          .logo [class*="accent"], .logo [class*="highlight"],
          .logo [class*="yellow"], .logo [class*="amber"],
          .logo [class*="gold"], .logo [class*="primary"] {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
          }
          .logo svg * { stroke: #ffffff !important; fill: #ffffff !important; }
          .logo svg text { fill: #ffffff !important; }
        `;

        function injectFinalCSS() {
          var existing = document.getElementById('logo-fix-injected');
          if (existing) existing.remove();

          var style = document.createElement('style');
          style.id = 'logo-fix-injected';
          style.textContent = cssRules;
          document.head.appendChild(style);
        }

        function forceWhite(el) {
          if (!el) return;
          el.style.setProperty('color', '#ffffff', 'important');
          el.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
        }

        function fixAll() {
          injectFinalCSS();

          document.querySelectorAll('.logo, [class*="logo"]').forEach(function(el) {
            forceWhite(el);
            el.style.setProperty('overflow', 'visible', 'important');
            el.style.setProperty('white-space', 'nowrap', 'important');
            el.style.setProperty('min-width', 'max-content', 'important');

            el.querySelectorAll('span').forEach(function(span) {
              forceWhite(span);
            });

            el.querySelectorAll('svg *').forEach(function(s) {
              s.style.setProperty('stroke', '#ffffff', 'important');
              s.style.setProperty('fill', '#ffffff', 'important');
            });
          });

          document.querySelectorAll('span').forEach(function(span) {
            var txt = span.textContent.trim();
            if (txt === 'Live' || txt === 'live') {
              var p = span.parentElement;
              if (p && (p.classList.contains('logo') || p.className.includes('logo') || p.className.includes('brand') || p.className.includes('Brand'))) {
                forceWhite(span);
              }
            }
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixAll);
        } else {
          fixAll();
        }

        [100, 300, 500, 800, 1000, 1500, 2000, 3000, 5000].forEach(function(t) {
          setTimeout(fixAll, t);
        });

        var intervalId = setInterval(fixAll, 300);
        setTimeout(function() { clearInterval(intervalId); }, 30000);

        if (document.body) {
          var obs = new MutationObserver(fixAll);
          obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            var obs = new MutationObserver(fixAll);
            obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          });
        }
      })();
    </script>
  </body>
</html>
