    <!-- ===== SECAO DE CONTATO ===== -->
    <div id="contact-section" style="background: #0a1628; padding: 40px 20px; text-align: center; font-family: 'Inter', system-ui, sans-serif;">

    <!-- Script de correcao dinamica apos React renderizar -->
    <script>
      // FORCAR links a abrir na MESMA aba (remove target="_blank")
      (function() {
        var observer = new MutationObserver(function() {
          document.querySelectorAll('a[target="_blank"]').forEach(function(a) {
            a.removeAttribute('target');
          });
        });
        observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
      })();
      (function() {
        function fixLogo() {
          // Procura por todos os possiveis logos
          var selectors = [
            '.logo', '.brand', '.nav-logo', '.header-logo', '.site-logo', '.brand-name',
            '[class*="logo"]', '[class*="brand"]'
          ];

          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            elements.forEach(function(el) {
              // Forca estilos inline (mais especifico que CSS)
              el.style.overflow = 'visible';
              el.style.whiteSpace = 'nowrap';
              el.style.minWidth = 'max-content';
              el.style.maxWidth = 'none';
              el.style.width = 'auto';
              el.style.flexShrink = '0';
              el.style.textOverflow = 'clip';

              // Procura spans dentro do logo
              var spans = el.querySelectorAll('span');
              spans.forEach(function(span, index) {
                span.style.display = 'inline';
                span.style.whiteSpace = 'nowrap';
                span.style.overflow = 'visible';

                // Todos os spans brancos
                span.style.color = '#ffffff';
                span.style.fontWeight = '700';
              });

              // Forcar SVG do icone branco
              var svgElements = el.querySelectorAll('svg *');
              svgElements.forEach(function(el) {
                el.style.stroke = '#ffffff';
                el.style.fill = '#ffffff';
              });
              // Se o logo tiver SVG com texto
              var texts = el.querySelectorAll('text');
              texts.forEach(function(text, index) {
                text.style.fill = '#ffffff';
              });
            });
          });
        }

        // Executa apos carregamento
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixLogo);
        } else {
          fixLogo();
        }

        // Reexecuta apos 1s e 3s (React pode renderizar depois)
        setTimeout(fixLogo, 1000);
        setTimeout(fixLogo, 3000);

        // Observa mudancas no DOM (React re-renderiza)
        var observer = new MutationObserver(function(mutations) {
          fixLogo();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true
        });
      })();
    </script>
  
    <!-- ===== INTERCEPTAR BOTAO ENTRAR - MESMA ABA ===== -->
    <script>
      (function() {
        // Intercepta cliques em botoes/links de "Entrar" ou "Login"
        document.addEventListener('click', function(e) {
          var target = e.target;

          // Procura o elemento clicado ou seus pais que sejam botoes/links de login
          var el = target;
          while (el && el !== document.body) {
            var text = el.textContent || el.innerText || '';
            var href = el.getAttribute('href') || '';

            // Verifica se é botão de entrar/login
            if (text && (
                text.trim() === 'Entrar' || 
                text.trim() === 'Login' || 
                text.trim() === 'Acessar' ||
                text.trim() === 'Fazer Login' ||
                href.includes('login')
              )) {

              // Se tiver href para login.html, navega na mesma aba
              if (href && href.includes('login')) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = href;
                return false;
              }

              // Se for um botão que pode abrir em nova aba, previne
              if (el.target === '_blank' || el.getAttribute('target') === '_blank') {
                e.preventDefault();
                e.stopPropagation();
                el.removeAttribute('target');
                // Simula o clique novamente sem target
                el.click();
                return false;
              }
            }
            el = el.parentElement;
          }
        }, true); // useCapture = true para interceptar antes

        // Também observa mudanças no DOM para remover target="_blank" de links de login
        var observer = new MutationObserver(function(mutations) {
          document.querySelectorAll('a[href*="login"], button, [role="button"]').forEach(function(el) {
            var text = el.textContent || el.innerText || '';
            if (text.trim() === 'Entrar' || text.trim() === 'Login' || text.trim() === 'Acessar') {
              el.removeAttribute('target');
              // Adiciona onclick inline para garantir mesma aba
              if (!el.getAttribute('data-entrada-fix')) {
                el.setAttribute('data-entrada-fix', 'true');
                el.addEventListener('click', function(ev) {
                  if (this.tagName === 'A' && this.href) {
                    ev.preventDefault();
                    window.location.href = this.href;
                  }
                });
              }
            }
          });
        });

        observer.observe(document.body || document.documentElement, { 
          childList: true, 
          subtree: true 
        });
      })();
    </script>

    <!-- ===== AJUSTES MENU: PLANOS (ANCORA), DEMONSTRACAO (WHATSAPP), OCULTAR ATUALIZACOES ===== -->
    <script>
      (function() {
        const WHATSAPP_DEMO_URL = 'https://api.whatsapp.com/send/?phone=5547935053141&text=Ol%C3%A1%21%20Tenho%20interesse%20em%20uma%20Demonstra%C3%A7%C3%A3o%20do%20Sistema.&type=phone_number&app_absent=0';
        
        // Marca elementos já processados para não reprocessar
        var processedLinks = new WeakSet();
        
        function ajustarMenu() {
          // Busca todos os links possíveis no footer/menu
          var allLinks = document.querySelectorAll('a, button, [role="link"], [class*="link"]');
          
          allLinks.forEach(function(el) {
            // Pula se já processou este elemento
            if (processedLinks.has(el)) return;
            
            var text = (el.textContent || el.innerText || '').trim();
            var href = (el.getAttribute('href') || '').trim();
            
            // --- 1) PLANOS E PREÇOS -> âncora #planos ---
            if (text === 'Planos e Preços' || text === 'Planos' || text === 'Preços') {
              processedLinks.add(el);
              el.setAttribute('href', '#planos');
              el.removeAttribute('target');
              // Remove qualquer listener anterior e adiciona novo
              el.onclick = function(ev) {
                ev.preventDefault();
                ev.stopPropagation();
                var secaoPlanos = document.getElementById('planos');
                if (secaoPlanos) {
                  secaoPlanos.scrollIntoView({ behavior: 'smooth' });
                } else {
                  window.location.hash = 'planos';
                }
                return false;
              };
            }
            
            // --- 2) DEMONSTRAÇÃO -> WhatsApp ---
            else if (text === 'Demonstração' || text === 'Demo' || text === 'Demonstracao') {
              processedLinks.add(el);
              el.setAttribute('href', WHATSAPP_DEMO_URL);
              el.setAttribute('target', '_blank');
              el.setAttribute('rel', 'noopener noreferrer');
              el.onclick = null; // Limpa onclick anterior
            }
            
            // --- 3) ATUALIZAÇÕES -> OCULTAR (não remover!) ---
            else if (text === 'Atualizações' || text === 'Atualizacoes' || text === 'Updates') {
              processedLinks.add(el);
              // Oculta visualmente mas mantém no DOM
              el.style.display = 'none';
              el.style.visibility = 'hidden';
              el.style.pointerEvents = 'none';
              // Também oculta o container pai (li ou div) se for um item de lista
              var parent = el.parentElement;
              if (parent && (parent.tagName === 'LI' || parent.tagName === 'UL' || parent.tagName === 'DIV')) {
                // Só oculta se o pai tiver apenas este link como filho visível
                var siblings = Array.from(parent.children).filter(function(c) {
                  return c !== el && c.style.display !== 'none';
                });
                if (siblings.length === 0) {
                  parent.style.display = 'none';
                  parent.style.visibility = 'hidden';
                }
              }
            }
          });
        }

        // Executa imediatamente
        ajustarMenu();
        
        // Reexecuta após React renderizar
        setTimeout(ajustarMenu, 300);
        setTimeout(ajustarMenu, 800);
        setTimeout(ajustarMenu, 1500);
        setTimeout(ajustarMenu, 3000);

        // Observa mudanças no DOM
        var observer = new MutationObserver(function() {
          ajustarMenu();
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      })();
    </script>

    <!-- ===== ANCORA PLANOS - GARANTIR QUE EXISTA ===== -->
    <script>
      (function() {
        function garantirAncoraPlanos() {
          if (!document.getElementById('planos')) {
            var ancora = document.createElement('div');
            ancora.id = 'planos';
            ancora.style.cssText = 'position: relative; top: -80px; height: 0; width: 0; pointer-events: none;';
            
            var contactSection = document.getElementById('contact-section');
            if (contactSection && contactSection.parentElement) {
              contactSection.parentElement.insertBefore(ancora, contactSection);
            } else {
              document.body.appendChild(ancora);
            }
          }
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', garantirAncoraPlanos);
        } else {
          garantirAncoraPlanos();
        }
        setTimeout(garantirAncoraPlanos, 1000);
      })();
    </script>
