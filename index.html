    <!-- ===== CORREÇÃO LOGO VENDALIVE - TUDO BRANCO ===== -->
    <style>
      /* RESET - força visibilidade em todos os elementos do header */
      header *, nav *, .header *, .nav *, [class*="header"] *, [class*="nav"] * {
        overflow: visible !important;
        text-overflow: clip !important;
      }

      header, nav, .header, .nav, [class*="header"], [class*="nav"] {
        overflow: visible !important;
      }

      /* Logo - TUDO BRANCO */
      .logo, .brand, .nav-logo, .header-logo, .site-logo, .brand-name,
      [class*="logo"]:not([class*="container"]):not([class*="wrapper"]),
      [class*="brand"]:not([class*="container"]):not([class*="wrapper"]) {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0px !important;
        white-space: nowrap !important;
        overflow: visible !important;
        min-width: max-content !important;
        max-width: none !important;
        width: auto !important;
        flex-shrink: 0 !important;
        flex-wrap: nowrap !important;
        text-overflow: clip !important;
        color: #ffffff !important;
      }

      /* TODOS os spans dentro do logo = BRANCO */
      .logo > *, .brand > *, .nav-logo > *, .header-logo > *,
      .site-logo > *, .brand-name > *,
      [class*="logo"] > *, [class*="brand"] > * {
        display: inline !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
        flex-shrink: 0 !important;
        color: #ffffff !important;
      }

      /* SVG dentro do logo */
      .logo svg, .brand svg, .nav-logo svg, .header-logo svg,
      .site-logo svg, .brand-name svg,
      [class*="logo"] svg, [class*="brand"] svg {
        flex-shrink: 0 !important;
        min-width: auto !important;
      }

      /* TEXTO "Venda" - BRANCO */
      .logo span:first-child, .brand span:first-child,
      .nav-logo span:first-child, .header-logo span:first-child,
      .logo > span:first-of-type, .brand > span:first-of-type,
      .nav-logo > span:first-of-type, .header-logo > span:first-of-type {
        color: #ffffff !important;
      }

      /* TEXTO "Live" - BRANCO TAMBÉM */
      .logo span:last-child, .brand span:last-child,
      .nav-logo span:last-child, .header-logo span:last-child,
      .logo > span:last-of-type, .brand > span:last-of-type,
      .nav-logo > span:last-of-type, .header-logo > span:last-of-type,
      .logo span:nth-child(2), .brand span:nth-child(2),
      .nav-logo span:nth-child(2), .header-logo span:nth-child(2),
      .logo .live, .brand .live, .nav-logo .live, .header-logo .live,
      .logo .Live, .brand .Live, .nav-logo .Live, .header-logo .Live,
      .logo .highlight, .brand .highlight, .nav-logo .highlight, .header-logo .highlight,
      .logo .accent, .brand .accent, .nav-logo .accent, .header-logo .accent,
      .logo .primary, .brand .primary, .nav-logo .primary, .header-logo .primary,
      .logo [class*="live"], .brand [class*="live"],
      .nav-logo [class*="live"], .header-logo [class*="live"],
      .logo [class*="Live"], .brand [class*="Live"],
      .nav-logo [class*="Live"], .header-logo [class*="Live"],
      .logo [class*="accent"], .brand [class*="accent"],
      .nav-logo [class*="accent"], .header-logo [class*="accent"],
      .logo [class*="yellow"], .brand [class*="yellow"],
      .nav-logo [class*="yellow"], .header-logo [class*="yellow"],
      .logo [class*="amber"], .brand [class*="amber"],
      .nav-logo [class*="amber"], .header-logo [class*="amber"],
      .logo [class*="gold"], .brand [class*="gold"],
      .nav-logo [class*="gold"], .header-logo [class*="gold"] {
        color: #ffffff !important;
        font-weight: 700 !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* FORCAR spans com style inline de cor */
      .logo span[style*="color"], [class*="logo"] span[style*="color"] {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* Se o logo for um SVG com texto - TUDO BRANCO */
      .logo text, .brand text, .nav-logo text, .header-logo text,
      .site-logo text, .brand-name text,
      [class*="logo"] text, [class*="brand"] text {
        fill: #ffffff !important;
      }

      .logo text:last-child, .brand text:last-child,
      .nav-logo text:last-child, .header-logo text:last-child,
      .logo text:nth-child(2), .brand text:nth-child(2),
      .nav-logo text:nth-child(2), .header-logo text:nth-child(2) {
        fill: #ffffff !important;
        font-weight: 700 !important;
      }


      /* ÍCONE SVG do logo - forçar branco */
      .logo svg *, .brand svg *, .nav-logo svg *, .header-logo svg *,
      .site-logo svg *, .brand-name svg *,
      [class*="logo"] svg *, [class*="brand"] svg * {
        stroke: #ffffff !important;
        fill: #ffffff !important;
      }
      .logo svg path[fill], .brand svg path[fill],
      .nav-logo svg path[fill], .header-logo svg path[fill] {
        fill: #ffffff !important;
      }
      .logo svg rect, .brand svg rect,
      .nav-logo svg rect, .header-logo svg rect {
        stroke: #ffffff !important;
      }
      .logo svg circle, .brand svg circle,
      .nav-logo svg circle, .header-logo svg circle {
        fill: #ffffff !important;
      }
      .logo svg text, .brand svg text,
      .nav-logo svg text, .header-logo svg text {
        fill: #ffffff !important;
      }

      /* Container do header */
      .header-left, .nav-left, [class*="header-left"], [class*="nav-left"],
      .header-start, .nav-start, [class*="header-start"], [class*="nav-start"] {
        overflow: visible !important;
        min-width: max-content !important;
        flex-shrink: 0 !important;
      }

      /* Mobile */
      @media (max-width: 768px) {
        .logo, .brand, .nav-logo, .header-logo,
        .site-logo, .brand-name,
        [class*="logo"]:not([class*="container"]):not([class*="wrapper"]),
        [class*="brand"]:not([class*="container"]):not([class*="wrapper"]) {
          font-size: 13px !important;
          transform: scale(0.92);
          transform-origin: left center;
          color: #ffffff !important;
        }
      }

      /* React root */
      #root .logo, #root .brand, #root .nav-logo, #root .header-logo,
      #root [class*="logo"], #root [class*="brand"] {
        overflow: visible !important;
        white-space: nowrap !important;
        min-width: max-content !important;
        color: #ffffff !important;
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Script V4 - requestAnimationFrame loop continuo -->
    <script>
      (function() {
        'use strict';

        function forceWhite(el) {
          if (!el) return;
          el.style.setProperty('color', '#ffffff', 'important');
          el.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
        }

        function fixLogo() {
          // Injeta CSS como ultimo stylesheet
          var css = '.logo,[class*="logo"]:not([class*="container"]):not([class*="wrapper"]){color:#fff!important;-webkit-text-fill-color:#fff!important}.logo span,[class*="logo"] span{color:#fff!important;-webkit-text-fill-color:#fff!important}.logo svg *{stroke:#fff!important;fill:#fff!important}';
          var existing = document.getElementById('logo-fix-dynamic');
          if (!existing) {
            var s = document.createElement('style');
            s.id = 'logo-fix-dynamic';
            s.textContent = css;
            document.head.appendChild(s);
          }

          // Forca cor branca em todos os elementos do logo
          var logos = document.querySelectorAll('.logo, [class*="logo"]');
          for (var i = 0; i < logos.length; i++) {
            var logo = logos[i];
            forceWhite(logo);
            var spans = logo.querySelectorAll('span');
            for (var j = 0; j < spans.length; j++) {
              forceWhite(spans[j]);
            }
            var svgs = logo.querySelectorAll('svg *');
            for (var k = 0; k < svgs.length; k++) {
              svgs[k].style.setProperty('stroke', '#ffffff', 'important');
              svgs[k].style.setProperty('fill', '#ffffff', 'important');
            }
          }

          // Busca especifica por spans com texto "Live"
          var allSpans = document.getElementsByTagName('span');
          for (var n = 0; n < allSpans.length; n++) {
            var sp = allSpans[n];
            if (sp.textContent.trim() === 'Live' || sp.textContent.trim() === 'live') {
              var parent = sp.parentElement;
              if (parent && (parent.className.indexOf('logo') !== -1 || parent.className.indexOf('brand') !== -1 || parent.className.indexOf('header') !== -1 || parent.className.indexOf('nav') !== -1)) {
                forceWhite(sp);
              }
            }
          }

          // Loop continuo via requestAnimationFrame
          requestAnimationFrame(fixLogo);
        }

        // Inicia
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixLogo);
        } else {
          fixLogo();
        }

        // Multiplos timeouts para garantir
        var delays = [100, 500, 1000, 2000, 3000, 5000];
        for (var d = 0; d < delays.length; d++) {
          setTimeout(fixLogo, delays[d]);
        }
      })();
    </script>
  </body>
