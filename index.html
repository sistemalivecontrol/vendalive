<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VendaLive - Sistema de Gestao para Lives. Gerencie pedidos, clientes, cobrancas e entregas em tempo real." />
    <meta name="theme-color" content="#0a1628" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VendaLive - Sistema de Gestao para Lives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ===== CORRECAO LOGO VENDALIVE - TUDO BRANCO V2 ===== -->
    <style id="fix-logo-v2">
      /* === RESET === */
      header *, nav *, .header *, .nav *, [class*="header"] *, [class*="nav"] * {
        overflow: visible !important;
        text-overflow: clip !important;
      }
      header, nav, .header, .nav, [class*="header"], [class*="nav"] {
        overflow: visible !important;
      }

      /* === LOGO - TUDO BRANCO COM MAXIMA ESPECIFICIDADE === */
      html body header .logo,
      html body nav .logo,
      html body header [class*="logo"],
      html body nav [class*="logo"],
      html body #root header [class*="logo"],
      html body #root nav [class*="logo"],
      html body #root [class*="header"] [class*="logo"],
      html body #root [class*="nav"] [class*="logo"],
      .logo, .brand, .nav-logo, .header-logo, .site-logo, .brand-name,
      [class*="logo"]:not([class*="container"]):not([class*="wrapper"]),
      [class*="brand"]:not([class*="container"]):not([class*="wrapper"]) {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0px !important;
        white-space: nowrap !important;
        overflow: visible !important;
        min-width: max-content !important;
        max-width: none !important;
        width: auto !important;
        flex-shrink: 0 !important;
        flex-wrap: nowrap !important;
        text-overflow: clip !important;
        color: #ffffff !important;
      }

      /* === TODOS OS SPANS DENTRO DO LOGO = BRANCO === */
      .logo > *, .brand > *, .nav-logo > *, .header-logo > *,
      .site-logo > *, .brand-name > *,
      [class*="logo"] > *, [class*="brand"] > *,
      html body .logo span,
      html body [class*="logo"] span,
      html body #root .logo span,
      html body #root [class*="logo"] span {
        display: inline !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
        flex-shrink: 0 !important;
        color: #ffffff !important;
      }

      /* === PRIMEIRO SPAN ("Venda") = BRANCO === */
      .logo span:first-child,
      [class*="logo"] span:first-child,
      .logo > span:first-of-type,
      [class*="logo"] > span:first-of-type {
        color: #ffffff !important;
      }

      /* === SEGUNDO SPAN ("Live") = BRANCO === */
      .logo span:last-child,
      [class*="logo"] span:last-child,
      .logo > span:last-of-type,
      [class*="logo"] > span:last-of-type,
      .logo span:nth-child(2),
      [class*="logo"] span:nth-child(2),
      .logo span:nth-of-type(2),
      [class*="logo"] span:nth-of-type(2),
      .logo .live, [class*="logo"] .live,
      .logo .Live, [class*="logo"] .Live,
      .logo .highlight, [class*="logo"] .highlight,
      .logo .accent, [class*="logo"] .accent,
      .logo .yellow, [class*="logo"] .yellow,
      .logo .gold, [class*="logo"] .gold,
      .logo .primary, [class*="logo"] .primary,
      .logo .brand-light, [class*="logo"] .brand-light,
      .logo .text-accent, [class*="logo"] .text-accent,
      .logo .text-yellow-400, [class*="logo"] .text-yellow-400,
      .logo .text-yellow-500, [class*="logo"] .text-yellow-500,
      .logo .text-amber-400, [class*="logo"] .text-amber-400,
      .logo .text-amber-500, [class*="logo"] .text-amber-500,
      .logo [class*="live"], [class*="logo"] [class*="live"],
      .logo [class*="Live"], [class*="logo"] [class*="Live"],
      .logo [class*="accent"], [class*="logo"] [class*="accent"],
      .logo [class*="highlight"], [class*="logo"] [class*="highlight"],
      .logo [class*="yellow"], [class*="logo"] [class*="yellow"],
      .logo [class*="gold"], [class*="logo"] [class*="gold"],
      .logo [class*="primary"], [class*="logo"] [class*="primary"],
      .logo [class*="amber"], [class*="logo"] [class*="amber"] {
        color: #ffffff !important;
        font-weight: 700 !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* === SPANS COM ESTILO INLINE DE COR === */
      .logo span[style*="color"],
      [class*="logo"] span[style*="color"] {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* === SVG DO LOGO === */
      .logo svg, [class*="logo"] svg {
        flex-shrink: 0 !important;
        min-width: auto !important;
      }
      .logo svg *, [class*="logo"] svg *,
      .logo svg path, [class*="logo"] svg path,
      .logo svg rect, [class*="logo"] svg rect,
      .logo svg circle, [class*="logo"] svg circle,
      .logo svg text, [class*="logo"] svg text {
        stroke: #ffffff !important;
        fill: #ffffff !important;
      }

      /* === TEXTOS SVG === */
      .logo text, [class*="logo"] text,
      .logo text:last-child, [class*="logo"] text:last-child,
      .logo text:nth-child(2), [class*="logo"] text:nth-child(2) {
        fill: #ffffff !important;
      }

      /* === CONTAINER DO HEADER === */
      .header-left, .nav-left, [class*="header-left"], [class*="nav-left"],
      .header-start, .nav-start, [class*="header-start"], [class*="nav-start"] {
        overflow: visible !important;
        min-width: max-content !important;
        flex-shrink: 0 !important;
      }

      /* === MOBILE === */
      @media (max-width: 768px) {
        .logo, [class*="logo"]:not([class*="container"]):not([class*="wrapper"]) {
          font-size: 13px !important;
          transform: scale(0.92);
          transform-origin: left center;
          color: #ffffff !important;
        }
        .logo span, [class*="logo"] span {
          color: #ffffff !important;
          -webkit-text-fill-color: #ffffff !important;
        }
      }

      /* === REACT ROOT === */
      #root .logo, #root [class*="logo"] {
        overflow: visible !important;
        white-space: nowrap !important;
        min-width: max-content !important;
        color: #ffffff !important;
      }
      #root .logo span, #root [class*="logo"] span {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
    </style>
    <!-- ==================================== -->

    <style>
      * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <script type="module" crossorigin src="./assets/index-DaOTygQi.js"></script>

</head>
  <body>
    <div id="root"></div>

    <!-- Script de correcao dinamica V2 - MUITO mais agressivo -->
    <script>
      (function() {
        'use strict';

        function forceWhite(el) {
          if (!el) return;
          // Forca cor branca com !important via setProperty
          el.style.setProperty('color', '#ffffff', 'important');
          el.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
          el.style.setProperty('display', 'inline', 'important');
          el.style.setProperty('white-space', 'nowrap', 'important');
          el.style.setProperty('overflow', 'visible', 'important');
        }

        function fixLogo() {
          var selectors = [
            '.logo', '.brand', '.nav-logo', '.header-logo', '.site-logo', '.brand-name',
            '[class*="logo"]', '[class*="brand"]'
          ];

          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            elements.forEach(function(el) {
              forceWhite(el);
              el.style.setProperty('overflow', 'visible', 'important');
              el.style.setProperty('white-space', 'nowrap', 'important');
              el.style.setProperty('min-width', 'max-content', 'important');
              el.style.setProperty('max-width', 'none', 'important');
              el.style.setProperty('width', 'auto', 'important');
              el.style.setProperty('flex-shrink', '0', 'important');
              el.style.setProperty('text-overflow', 'clip', 'important');

              var spans = el.querySelectorAll('span');
              spans.forEach(function(span) {
                forceWhite(span);
                span.style.setProperty('font-weight', '700', 'important');
              });

              var svgEls = el.querySelectorAll('svg *');
              svgEls.forEach(function(s) {
                s.style.setProperty('stroke', '#ffffff', 'important');
                s.style.setProperty('fill', '#ffffff', 'important');
              });

              var texts = el.querySelectorAll('text');
              texts.forEach(function(t) {
                t.style.setProperty('fill', '#ffffff', 'important');
              });
            });
          });

          // Busca por qualquer span que tenha texto "Live" ou "live"
          var allSpans = document.querySelectorAll('span');
          allSpans.forEach(function(span) {
            var text = span.textContent.trim();
            if (text === 'Live' || text === 'live' || text === 'LIVE') {
              var parent = span.parentElement;
              if (parent && (
                parent.classList.contains('logo') ||
                parent.className.includes('logo') ||
                parent.className.includes('brand') ||
                parent.className.includes('Logo')
              )) {
                forceWhite(span);
              }
            }
          });
        }

        // Executa imediatamente
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixLogo);
        } else {
          fixLogo();
        }

        // Multiplos timeouts para pegar renderizacoes do React
        var timeouts = [50, 100, 200, 300, 500, 800, 1000, 1500, 2000, 3000, 5000];
        timeouts.forEach(function(t) {
          setTimeout(fixLogo, t);
        });

        // Intervalo contínuo por 30 segundos (React pode re-renderizar)
        var intervalId = setInterval(fixLogo, 500);
        setTimeout(function() { clearInterval(intervalId); }, 30000);

        // Observa mudancas no DOM
        var observer = new MutationObserver(function() {
          fixLogo();
        });

        if (document.body) {
          observer.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['style', 'class']
          });
        } else {
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['style', 'class']
            });
          });
        }
      })();
    </script>
  </body>
</html>
