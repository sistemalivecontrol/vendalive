<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VendaLive - Sistema de Gestão para Lives. Gerencie pedidos, clientes, cobranças e entregas em tempo real." />
    <meta name="theme-color" content="#0a1628" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VendaLive - Sistema de Gestão para Lives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ===== CORREÇÃO LOGO VENDALIVE - TUDO BRANCO ===== -->
    <style>
      /* === RESET === */
      header *, nav *, .header *, .nav *, [class*="header"] *, [class*="nav"] * {
        overflow: visible !important;
        text-overflow: clip !important;
      }
      header, nav, .header, .nav, [class*="header"], [class*="nav"] {
        overflow: visible !important;
      }

      /* === LOGO - TUDO BRANCO COM MÁXIMA ESPECIFICIDADE === */
      html body header .logo,
      html body nav .logo,
      html body header [class*="logo"],
      html body nav [class*="logo"],
      html body #root header [class*="logo"],
      html body #root nav [class*="logo"],
      html body #root [class*="header"] [class*="logo"],
      html body #root [class*="nav"] [class*="logo"],
      .logo, .brand, .nav-logo, .header-logo, .site-logo, .brand-name,
      [class*="logo"]:not([class*="container"]):not([class*="wrapper"]),
      [class*="brand"]:not([class*="container"]):not([class*="wrapper"]) {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0px !important;
        white-space: nowrap !important;
        overflow: visible !important;
        min-width: max-content !important;
        max-width: none !important;
        width: auto !important;
        flex-shrink: 0 !important;
        flex-wrap: nowrap !important;
        text-overflow: clip !important;
        color: #ffffff !important;
      }

      /* === TODOS OS SPANS DENTRO DO LOGO = BRANCO === */
      .logo > *, .brand > *, .nav-logo > *, .header-logo > *,
      .site-logo > *, .brand-name > *,
      [class*="logo"] > *, [class*="brand"] > *,
      html body .logo span,
      html body [class*="logo"] span,
      html body #root .logo span,
      html body #root [class*="logo"] span {
        display: inline !important;
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
        flex-shrink: 0 !important;
        color: #ffffff !important;
      }

      /* === PRIMEIRO SPAN ("Venda") = BRANCO === */
      .logo span:first-child,
      [class*="logo"] span:first-child,
      .logo > span:first-of-type,
      [class*="logo"] > span:first-of-type {
        color: #ffffff !important;
      }

      /* === SEGUNDO SPAN ("Live") = BRANCO === */
      .logo span:last-child,
      [class*="logo"] span:last-child,
      .logo > span:last-of-type,
      [class*="logo"] > span:last-of-type,
      .logo span:nth-child(2),
      [class*="logo"] span:nth-child(2),
      .logo span:nth-of-type(2),
      [class*="logo"] span:nth-of-type(2),
      .logo .live, [class*="logo"] .live,
      .logo .Live, [class*="logo"] .Live,
      .logo .highlight, [class*="logo"] .highlight,
      .logo .accent, [class*="logo"] .accent,
      .logo .yellow, [class*="logo"] .yellow,
      .logo .gold, [class*="logo"] .gold,
      .logo .primary, [class*="logo"] .primary,
      .logo .brand-light, [class*="logo"] .brand-light,
      .logo .text-accent, [class*="logo"] .text-accent,
      .logo .text-yellow-400, [class*="logo"] .text-yellow-400,
      .logo .text-yellow-500, [class*="logo"] .text-yellow-500,
      .logo .text-amber-400, [class*="logo"] .text-amber-400,
      .logo .text-amber-500, [class*="logo"] .text-amber-500,
      .logo [class*="live"], [class*="logo"] [class*="live"],
      .logo [class*="Live"], [class*="logo"] [class*="Live"],
      .logo [class*="accent"], [class*="logo"] [class*="accent"],
      .logo [class*="highlight"], [class*="logo"] [class*="highlight"],
      .logo [class*="yellow"], [class*="logo"] [class*="yellow"],
      .logo [class*="gold"], [class*="logo"] [class*="gold"],
      .logo [class*="primary"], [class*="logo"] [class*="primary"],
      .logo [class*="amber"], [class*="logo"] [class*="amber"] {
        color: #ffffff !important;
        font-weight: 700 !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* === SPANS COM ESTILO INLINE DE COR === */
      .logo span[style*="color"],
      [class*="logo"] span[style*="color"] {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* === SVG DO LOGO === */
      .logo svg, [class*="logo"] svg {
        flex-shrink: 0 !important;
        min-width: auto !important;
      }
      .logo svg *, [class*="logo"] svg *,
      .logo svg path, [class*="logo"] svg path,
      .logo svg rect, [class*="logo"] svg rect,
      .logo svg circle, [class*="logo"] svg circle,
      .logo svg text, [class*="logo"] svg text {
        stroke: #ffffff !important;
        fill: #ffffff !important;
      }

      /* === TEXTOS SVG === */
      .logo text, [class*="logo"] text,
      .logo text:last-child, [class*="logo"] text:last-child,
      .logo text:nth-child(2), [class*="logo"] text:nth-child(2) {
        fill: #ffffff !important;
      }

      /* === CONTAINER DO HEADER === */
      .header-left, .nav-left, [class*="header-left"], [class*="nav-left"],
      .header-start, .nav-start, [class*="header-start"], [class*="nav-start"] {
        overflow: visible !important;
        min-width: max-content !important;
        flex-shrink: 0 !important;
      }

      /* === MOBILE === */
      @media (max-width: 768px) {
        .logo, [class*="logo"]:not([class*="container"]):not([class*="wrapper"]) {
          font-size: 13px !important;
          transform: scale(0.92);
          transform-origin: left center;
          color: #ffffff !important;
        }
        .logo span, [class*="logo"] span {
          color: #ffffff !important;
          -webkit-text-fill-color: #ffffff !important;
        }
      }

      /* === REACT ROOT === */
      #root .logo, #root [class*="logo"] {
        overflow: visible !important;
        white-space: nowrap !important;
        min-width: max-content !important;
        color: #ffffff !important;
      }
      #root .logo span, #root [class*="logo"] span {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
    </style>
    <!-- ==================================== -->

    <style>
      * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <script type="module" crossorigin src="./assets/index-DaOTygQi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C3lEyXtq.css">
  <base target="_blank">
<base target="_blank">
</head>
  <body>
    <div id="root"></div>

    <!-- Script de correção dinâmica após React renderizar -->
    <script>
      (function() {
        function fixLogo() {
          var selectors = [
            '.logo', '.brand', '.nav-logo', '.header-logo', '.site-logo', '.brand-name',
            '[class*="logo"]', '[class*="brand"]'
          ];

          selectors.forEach(function(sel) {
            var elements = document.querySelectorAll(sel);
            elements.forEach(function(el) {
              el.style.overflow = 'visible';
              el.style.whiteSpace = 'nowrap';
              el.style.minWidth = 'max-content';
              el.style.maxWidth = 'none';
              el.style.width = 'auto';
              el.style.flexShrink = '0';
              el.style.textOverflow = 'clip';

              var spans = el.querySelectorAll('span');
              spans.forEach(function(span) {
                span.style.display = 'inline';
                span.style.whiteSpace = 'nowrap';
                span.style.overflow = 'visible';
                span.style.color = '#ffffff';
                span.style.fontWeight = '700';
                span.style.webkitTextFillColor = '#ffffff';
              });

              var svgElements = el.querySelectorAll('svg *');
              svgElements.forEach(function(svgEl) {
                svgEl.style.stroke = '#ffffff';
                svgEl.style.fill = '#ffffff';
              });

              var texts = el.querySelectorAll('text');
              texts.forEach(function(text) {
                text.style.fill = '#ffffff';
              });
            });
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixLogo);
        } else {
          fixLogo();
        }

        setTimeout(fixLogo, 100);
        setTimeout(fixLogo, 500);
        setTimeout(fixLogo, 1000);
        setTimeout(fixLogo, 2000);
        setTimeout(fixLogo, 3000);

        var observer = new MutationObserver(function() {
          fixLogo();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true
        });
      })();
    </script>
  </body>
</html>
