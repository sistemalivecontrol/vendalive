<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Vendas - VendaLive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0B193F 0%, #1a2d5c 100%); 
            min-height: 100vh; 
            padding: 20px;
            color: #1e293b;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 24px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); 
            padding: 20px 30px; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px) scale(1.02); }
        .btn-primary {
            background: linear-gradient(135deg, #0B193F, #1a2d5c);
            color: white;
            box-shadow: 0 4px 14px rgba(11, 25, 63, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .content { padding: 30px; }
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat-card { 
            background: white;
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #64748b; font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
        .stat-card .value { font-size: 2rem; font-weight: 800; color: #0B193F; }
        .actions-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 15px; 
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        .search-box { display: flex; gap: 10px; flex: 1; min-width: 300px; }
        .search-box input { 
            flex: 1; 
            padding: 14px 20px; 
            border: 2px solid #e2e8f0; 
            border-radius: 50px; 
            font-size: 14px;
            background: #f8fafc;
        }
        .search-box input:focus { outline: none; border-color: #667eea; background: white; }
        .table-container { 
            overflow-x: auto; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            background: white;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: linear-gradient(135deg, #0B193F, #1a2d5c); color: white; }
        th { padding: 16px; text-align: left; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; }
        tbody tr:hover { background: #f8f9ff; }
        .status-badge { padding: 6px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pago { background: #d1fae5; color: #065f46; }
        .status-pendente { background: #fef3c7; color: #92400e; }
        .valor { font-weight: 800; color: #10b981; }
        .acoes { display: flex; gap: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 24px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 80px rgba(0,0,0,0.3); }
        .modal-header { background: linear-gradient(135deg, #0B193F, #1a2d5c); color: white; padding: 30px; border-radius: 24px 24px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 600; color: #444; font-size: 0.9rem; }
        .form-group input, .form-group select { padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 50px; font-size: 15px; background: #f8fafc; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; background: white; }
        .item-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid transparent; }
        .item-card:hover { border-color: #667eea; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .item-numero { background: linear-gradient(135deg, #0B193F, #1a2d5c); color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .btn-remover-item { background: #fee2e2; color: #ef4444; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .btn-remover-item:hover { background: #ef4444; color: white; }
        .item-grid { display: grid; grid-template-columns: 2fr 0.7fr 1.3fr 1fr; gap: 12px; }
        .input-preco { position: relative; }
        .input-preco::before { content: 'R$'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #0B193F; font-weight: 700; font-size: 0.85rem; pointer-events: none; }
        .input-preco input { padding-left: 40px !important; }
        .btn-adicionar-item { width: 100%; padding: 16px; background: white; border: 2px dashed #667eea; color: #667eea; border-radius: 16px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-adicionar-item:hover { background: #0B193F; color: white; border-style: solid; }
        .modal-total-section { background: linear-gradient(135deg, #0B193F, #1a2d5c); color: white; padding: 24px 30px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .modal-footer { padding: 25px 30px; border-top: 2px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px; background: #f8fafc; }
        .toast { position: fixed; bottom: 30px; right: 30px; padding: 18px 28px; border-radius: 16px; color: white; font-weight: 700; box-shadow: 0 15px 40px rgba(0,0,0,0.3); transform: translateX(450px); transition: all 0.5s; z-index: 3000; }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, #10b981, #34d399); }
        @media (max-width: 768px) { .form-grid, .item-grid { grid-template-columns: 1fr; } .header { flex-direction: column; text-align: center; } }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="btn btn-primary" onclick="window.location.href='index.html'">← Voltar</button>
                <div>
                    <h1 style="color: #0B193F; font-size: 1.6rem;">📊 Gestão de Vendas</h1>
                    <p style="color: #64748b; font-size: 0.85rem;">Cadastro e gestão de vendas</p>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="toggleDarkMode()">🌙</button>
                <div style="display: flex; align-items: center; gap: 12px; background: #f1f5f9; padding: 10px 20px; border-radius: 50px;">
                    <span>👤 Usuário Teste</span>
                    <button class="btn" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 8px 16px;">🚪 Sair</button>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card"><h3>Total de Vendas</h3><div class="value" id="totalVendas">0</div></div>
                <div class="stat-card"><h3>Vendas do Mês</h3><div class="value" id="vendasMes">0</div></div>
                <div class="stat-card"><h3>Valor Total (Mês)</h3><div class="value" id="valorTotal">R$ 0,00</div></div>
                <div class="stat-card"><h3>Pendentes</h3><div class="value" id="vendasPendentes">0</div></div>
            </div>

            <div class="actions-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por comprador..." onkeyup="filtrarVendas()">
                    <button class="btn btn-primary">🔍 Buscar</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <select id="filtroStatus" onchange="filtrarVendas()" style="padding: 12px 18px; border-radius: 50px; border: 2px solid #e2e8f0;">
                        <option value="">Todos Status</option>
                        <option value="pendente">⏳ Pendente</option>
                        <option value="pago">✅ Pago</option>
                    </select>
                    <button class="btn btn-success" onclick="abrirModal()">+ Nova Venda</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Comprador</th><th>Canal</th><th>Valor Total</th><th>Pagamento</th><th>Entrega</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="tabelaVendas">
                        <tr><td colspan="7" style="text-align: center; padding: 60px; color: #64748b;">Carregando vendas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="modalVenda">
        <div class="modal-content">
            <div class="modal-header">
                <div><h2>🛒 Nova Venda</h2><p>Preencha os dados da venda</p></div>
                <button class="btn" style="background: rgba(255,255,255,0.2); color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 24px;" onclick="fecharModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Comprador *</label>
                        <input type="text" id="comprador" placeholder="Nome do comprador" required>
                    </div>
                    <div class="form-group">
                        <label>Canal de Venda *</label>
                        <select id="canalVenda" required>
                            <option value="live">📱 Live Instagram</option>
                            <option value="whatsapp">💬 WhatsApp</option>
                            <option value="loja_fisica">🏪 Loja Física</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Forma de Pagamento *</label>
                        <select id="formaPagamento" required>
                            <option value="pix">💠 PIX</option>
                            <option value="dinheiro">💵 Dinheiro</option>
                            <option value="cartao">💳 Cartão</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status Pagamento *</label>
                        <select id="statusPagamento" required>
                            <option value="pendente">⏳ Pendente</option>
                            <option value="pago">✅ Pago</option>
                        </select>
                    </div>
                </div>

                <div style="margin: 20px 0;">
                    <h3 style="color: #0B193F; margin-bottom: 15px;">Itens da Venda</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
                        <button class="btn" style="background: white; border: 2px solid #e2e8f0;" onclick="adicionarItemTemplate('Camiseta', 49.90)">👕 Camiseta R$49,90</button>
                        <button class="btn" style="background: white; border: 2px solid #e2e8f0;" onclick="adicionarItemTemplate('Calça', 89.90)">👖 Calça R$89,90</button>
                        <button class="btn" style="background: white; border: 2px solid #e2e8f0;" onclick="adicionarItemTemplate('Tênis', 149.90)">👟 Tênis R$149,90</button>
                        <button class="btn" style="background: white; border: 2px solid #e2e8f0;" onclick="adicionarItemTemplate('Boné', 39.90)">🧢 Boné R$39,90</button>
                    </div>
                    <div id="itensContainer"></div>
                    <button class="btn-adicionar-item" onclick="adicionarItem()">+ Adicionar Item</button>
                </div>

                <div class="modal-total-section">
                    <span style="font-size: 1.1rem;">Total da Venda</span>
                    <span style="font-size: 2.2rem; font-weight: 800;" id="totalVendaModal">R$ 0,00</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" style="background: white; border: 2px solid #e2e8f0; color: #64748b;" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-success" onclick="salvarVenda()" id="btnSalvar">💾 Salvar Venda</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let contadorItens = 0;
        let vendas = JSON.parse(localStorage.getItem('vendas') || '[]');

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
        }

        function formatarData(data) {
            return new Date(data).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function mostrarToast(mensagem, tipo = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.className = `toast ${tipo} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function atualizarEstatisticas() {
            const total = vendas.length;
            const pendentes = vendas.filter(v => v.status_pagamento === 'pendente').length;
            const valorTotal = vendas.reduce((acc, v) => acc + (v.total || 0), 0);

            document.getElementById('totalVendas').textContent = total;
            document.getElementById('vendasMes').textContent = total; // Simplificado
            document.getElementById('valorTotal').textContent = formatarMoeda(valorTotal);
            document.getElementById('vendasPendentes').textContent = pendentes;
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tabelaVendas');
            if (vendas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 60px; color: #64748b;"><h3>Nenhuma venda ainda</h3><p>Clique em "Nova Venda" para começar</p></td></tr>';
                return;
            }

            tbody.innerHTML = vendas.map((v, i) => `
                <tr>
                    <td>${formatarData(v.data)}</td>
                    <td><strong>${v.comprador}</strong></td>
                    <td>${v.canal}</td>
                    <td class="valor">${formatarMoeda(v.total)}</td>
                    <td><span class="status-badge status-${v.status}">${v.status === 'pago' ? '✅ Pago' : '⏳ Pendente'}</span></td>
                    <td>📦 Não Enviado</td>
                    <td class="acoes">
                        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="excluirVenda(${i})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function abrirModal() {
            document.getElementById('modalVenda').classList.add('active');
            document.getElementById('comprador').focus();
            contadorItens = 0;
            document.getElementById('itensContainer').innerHTML = '';
            adicionarItem();
        }

        function fecharModal() {
            document.getElementById('modalVenda').classList.remove('active');
        }

        function adicionarItem() {
            contadorItens++;
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div class="item-header">
                    <div class="item-numero">${contadorItens}</div>
                    <button class="btn-remover-item" onclick="this.closest('.item-card').remove(); atualizarTotal()">×</button>
                </div>
                <div class="item-grid">
                    <div class="form-group">
                        <label>Produto</label>
                        <input type="text" class="produto-nome" placeholder="Nome" required oninput="atualizarTotal()">
                    </div>
                    <div class="form-group">
                        <label>Qtd</label>
                        <input type="number" class="produto-qtd" min="1" value="1" required oninput="atualizarTotal()">
                    </div>
                    <div class="form-group">
                        <label>Preço</label>
                        <div class="input-preco">
                            <input type="number" class="produto-preco" step="0.01" min="0" placeholder="0,00" required oninput="atualizarTotal()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Desconto</label>
                        <div class="input-preco">
                            <input type="number" class="produto-desconto" step="0.01" min="0" value="0" oninput="atualizarTotal()">
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('itensContainer').appendChild(div);
        }

        function adicionarItemTemplate(nome, preco) {
            adicionarItem();
            const cards = document.querySelectorAll('.item-card');
            const lastCard = cards[cards.length - 1];
            lastCard.querySelector('.produto-nome').value = nome;
            lastCard.querySelector('.produto-preco').value = preco;
            atualizarTotal();
        }

        function atualizarTotal() {
            let total = 0;
            document.querySelectorAll('.item-card').forEach(card => {
                const qtd = parseFloat(card.querySelector('.produto-qtd').value) || 0;
                const preco = parseFloat(card.querySelector('.produto-preco').value) || 0;
                const desconto = parseFloat(card.querySelector('.produto-desconto').value) || 0;
                total += (qtd * preco) - desconto;
            });
            document.getElementById('totalVendaModal').textContent = formatarMoeda(total);
        }

        function salvarVenda() {
            const comprador = document.getElementById('comprador').value.trim();
            if (!comprador) { mostrarToast('Nome do comprador é obrigatório!', 'error'); return; }

            const itens = [];
            let total = 0;
            document.querySelectorAll('.item-card').forEach(card => {
                const nome = card.querySelector('.produto-nome').value.trim();
                const qtd = parseFloat(card.querySelector('.produto-qtd').value) || 0;
                const preco = parseFloat(card.querySelector('.produto-preco').value) || 0;
                const desconto = parseFloat(card.querySelector('.produto-desconto').value) || 0;
                if (nome && qtd > 0 && preco > 0) {
                    const subtotal = (qtd * preco) - desconto;
                    total += subtotal;
                    itens.push({ nome, qtd, preco, desconto, subtotal });
                }
            });

            if (itens.length === 0) { mostrarToast('Adicione pelo menos um item!', 'error'); return; }

            const venda = {
                id: Date.now(),
                comprador,
                canal: document.getElementById('canalVenda').value,
                forma: document.getElementById('formaPagamento').value,
                status: document.getElementById('statusPagamento').value,
                total,
                itens,
                data: new Date().toISOString()
            };

            vendas.unshift(venda);
            localStorage.setItem('vendas', JSON.stringify(vendas));

            mostrarToast('✅ Venda salva com sucesso!');
            fecharModal();
            atualizarEstatisticas();
            renderizarTabela();
        }

        function excluirVenda(index) {
            if (confirm('Tem certeza que deseja excluir esta venda?')) {
                vendas.splice(index, 1);
                localStorage.setItem('vendas', JSON.stringify(vendas));
                atualizarEstatisticas();
                renderizarTabela();
                mostrarToast('Venda excluída');
            }
        }

        function filtrarVendas() {
            // Simplificado - apenas re-renderiza
            renderizarTabela();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // Inicializar
        atualizarEstatisticas();
        renderizarTabela();

        // Atalhos
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                if (document.getElementById('modalVenda').classList.contains('active')) {
                    salvarVenda();
                }
            }
            if (e.key === 'Escape') fecharModal();
        });
    </script>
</body>
</html>
