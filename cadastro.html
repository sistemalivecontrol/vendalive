<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendaLive - Cadastro</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/lojaebrechopingodegente/LiveControl@main/assets/favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #4a9eff, #6b5ce7);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(74, 158, 255, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #fff, #4a9eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8b9dc3;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b9dc3;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #5a6a8a;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a9eff, #6b5ce7);
            color: #fff;
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(74, 158, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: #8b9dc3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-box {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .status-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .status-box.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .hidden { display: none !important; }

        .plano-card {
            padding: 16px;
            border: 2px solid rgba(74, 158, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .plano-card:hover {
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.05);
        }

        .plano-card.selected {
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.1);
        }

        .plano-card h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .plano-card .preco {
            font-size: 24px;
            font-weight: 700;
            color: #4a9eff;
        }

        .plano-card .preco span {
            font-size: 14px;
            font-weight: 400;
            color: #8b9dc3;
        }

        .erro-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .warning-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>

<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="logo">📺</div>
        <h1>VendaLive</h1>
        <p class="subtitle">Crie sua conta para começar a usar</p>

        <div class="card" id="card-form">
            <div class="status-box" id="status-box"></div>

            <form id="form-cadastro" onsubmit="return false;">
                <div class="form-group">
                    <label>Nome da Empresa / Nome Completo *</label>
                    <input type="text" id="nome" placeholder="Ex: Loja Pingo de Gente" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>CPF ou CNPJ *</label>
                        <input type="text" id="cpf_cnpj" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone *</label>
                        <input type="text" id="telefone" placeholder="(47) 99999-9999" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>E-mail *</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Senha *</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <div class="form-group">
                    <label>Confirmar Senha *</label>
                    <input type="password" id="senha_confirmar" placeholder="Repita a senha" required>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 13px; color: #8b9dc3; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">Escolha seu Plano</label>

                    <div class="plano-card selected" data-plano="Teste" data-valor="0.00" data-teste="true" onclick="selecionarPlano(this)">
                        <h3>🎁 Plano Teste Grátis</h3>
                        <div class="preco">GRÁTIS<span>/7 dias</span></div>
                        <p style="font-size: 12px; color: #8b9dc3; margin-top: 4px;">Teste todas as funcionalidades por 7 dias</p>
                    </div>

                    <div class="plano-card" data-plano="Basic" data-valor="80.00" onclick="selecionarPlano(this)">
                        <h3>Plano Basic</h3>
                        <div class="preco">R$ 80,00<span>/mês</span></div>
                        <p style="font-size: 12px; color: #8b9dc3; margin-top: 4px;">Ideal para começar</p>
                    </div>

                    <div class="plano-card" data-plano="Pro" data-valor="150.00" onclick="selecionarPlano(this)">
                        <h3>Plano Pro</h3>
                        <div class="preco">R$ 150,00<span>/mês</span></div>
                        <p style="font-size: 12px; color: #8b9dc3; margin-top: 4px;">Para quem quer mais recursos</p>
                    </div>
                </div>

                <button type="button" class="btn btn-primary" id="btn-cadastrar" onclick="realizarCadastro()">
                    <span id="btn-texto">Criar Conta e Começar Teste Grátis</span>
                </button>

                <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'">
                    Já tem conta? Faça Login
                </button>
            </form>
        </div>

        <div class="card hidden" id="card-erro">
            <div class="erro-box">
                <div class="warning-icon">⚠️</div>
                <h3>Ops! Algo deu errado</h3>
                <p id="erro-mensagem">Erro ao processar cadastro</p>
                <button class="btn btn-primary" onclick="tentarNovamente()">
                    🔄 Tentar Novamente
                </button>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const SUPABASE_URL = 'https://aqrvozmxlcgrllclceke.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxcnZvem14bGNncmxsY2xjZWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNTk0MDEsImV4cCI6MjA5MTgzNTQwMX0.6CL3-1dU6WUT4EbJ0UfvmLFj6jGPnT9Avc743WrNiCA';

        let supabaseClient = null;
        let planoSelecionado = 'Teste';
        let valorPlano = 0.00;
        let isPlanoTeste = true;

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('[CADASTRO] Inicializando...');

            await aguardarSupabase();

            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('[CADASTRO] Supabase inicializado');
            } else {
                console.error('[CADASTRO] Supabase não disponível');
                mostrarErro('Erro de conexão. Recarregue a página.');
            }
        });

        async function aguardarSupabase(maxTentativas = 20) {
            let tentativas = 0;
            while (tentativas < maxTentativas) {
                if (window.supabase && typeof window.supabase === 'object') {
                    return true;
                }
                tentativas++;
                await new Promise(r => setTimeout(r, 300));
            }
            return false;
        }

        // ============================================
        // SELECIONAR PLANO
        // ============================================
        function selecionarPlano(elemento) {
            document.querySelectorAll('.plano-card').forEach(el => el.classList.remove('selected'));
            elemento.classList.add('selected');
            planoSelecionado = elemento.dataset.plano;
            valorPlano = parseFloat(elemento.dataset.valor);
            isPlanoTeste = elemento.dataset.teste === 'true';

            // Atualizar texto do botão
            const btnTexto = document.getElementById('btn-texto');
            if (isPlanoTeste) {
                btnTexto.textContent = 'Criar Conta e Começar Teste Grátis';
            } else {
                btnTexto.textContent = 'Criar Conta e Ir para Pagamento';
            }

            console.log('[CADASTRO] Plano selecionado:', planoSelecionado, 'R$', valorPlano, 'Teste:', isPlanoTeste);
        }

        // ============================================
        // VALIDAR CPF/CNPJ
        // ============================================
        function validarCpfCnpj(valor) {
            const limpo = valor.replace(/\D/g, '');
            return limpo.length === 11 || limpo.length === 14;
        }

        // ============================================
        // REALIZAR CADASTRO
        // ============================================
        async function realizarCadastro() {
            console.log('[CADASTRO] Iniciando cadastro...');

            // Validar campos
            const nome = document.getElementById('nome').value.trim();
            const cpfCnpj = document.getElementById('cpf_cnpj').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const senhaConfirmar = document.getElementById('senha_confirmar').value;

            if (!nome || !cpfCnpj || !telefone || !email || !senha) {
                mostrarStatus('error', 'Preencha todos os campos obrigatórios');
                return;
            }

            if (!validarCpfCnpj(cpfCnpj)) {
                mostrarStatus('error', 'CPF ou CNPJ inválido');
                return;
            }

            if (senha.length < 6) {
                mostrarStatus('error', 'A senha deve ter no mínimo 6 caracteres');
                return;
            }

            if (senha !== senhaConfirmar) {
                mostrarStatus('error', 'As senhas não conferem');
                return;
            }

            const btn = document.getElementById('btn-cadastrar');
            btn.disabled = true;
            document.getElementById('btn-texto').innerHTML = '<span class="loading"></span> Criando conta...';

            try {
                // 1. Criar usuário no Auth do Supabase
                console.log('[CADASTRO] Criando usuário no Auth...');
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: {
                            nome: nome,
                            telefone: telefone
                        }
                    }
                });

                let authId = null;

                if (authError) {
                    // Se o email já existe, tentar login
                    if (authError.message.includes('already registered') || authError.message.includes('already exists')) {
                        console.log('[CADASTRO] Email já existe, tentando login...');
                        const { data: loginData, error: loginError } = await supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: senha
                        });

                        if (loginError) throw new Error('Email já cadastrado. Use outro email ou faça login.');
                        authId = loginData.user.id;
                        console.log('[CADASTRO] Usuário logado:', authId);
                    } else {
                        throw authError;
                    }
                } else {
                    authId = authData.user.id;
                    console.log('[CADASTRO] Usuário Auth criado:', authId);
                }

                // 2. Criar cliente no banco (clientes_sistema)
                console.log('[CADASTRO] Criando cliente no banco...');
                let clienteData = null;
                let clienteId = null;

                const { data: novoCliente, error: clienteError } = await supabaseClient
                    .from('clientes_sistema')
                    .insert({
                        nome: nome,
                        cnpj: cpfCnpj.replace(/\D/g, ''),
                        email: email,
                        telefone: telefone,
                        ativo: false,
                        status_pagamento: 'pendente',
                        plano: planoSelecionado,
                        created_at: new Date().toISOString()
                    })
                    .select()
                    .single();

                if (clienteError) {
                    // Se CNPJ duplicado
                    if (clienteError.message.includes('duplicate') || clienteError.message.includes('unique constraint')) {
                        console.log('[CADASTRO] CNPJ/Email duplicado, buscando cliente existente...');

                        // Buscar cliente existente por email
                        const { data: existente, error: buscaError } = await supabaseClient
                            .from('clientes_sistema')
                            .select('*')
                            .eq('email', email)
                            .single();

                        if (buscaError || !existente) {
                            // Tentar buscar por CNPJ
                            const { data: existenteCnpj, error: buscaCnpjError } = await supabaseClient
                                .from('clientes_sistema')
                                .select('*')
                                .eq('cnpj', cpfCnpj.replace(/\D/g, ''))
                                .single();

                            if (buscaCnpjError || !existenteCnpj) {
                                throw new Error('Erro ao criar cliente: ' + clienteError.message);
                            }

                            clienteData = existenteCnpj;
                        } else {
                            clienteData = existente;
                        }

                        console.log('[CADASTRO] Cliente existente encontrado:', clienteData.id);

                        // Atualizar auth_id do cliente existente
                        await supabaseClient
                            .from('clientes_sistema')
                            .update({ auth_id: authId })
                            .eq('id', clienteData.id);

                    } else {
                        throw clienteError;
                    }
                } else {
                    clienteData = novoCliente;
                }

                clienteId = clienteData.id;
                console.log('[CADASTRO] Cliente ID:', clienteId);

                // 3. Criar usuário na tabela usuarios_pg
                console.log('[CADASTRO] Criando usuário na tabela usuarios_pg...');
                try {
                    await supabaseClient
                        .from('usuarios_pg')
                        .insert({
                            auth_id: authId,
                            email: email,
                            nome: nome,
                            cliente_id: clienteId,
                            nivel_acesso: 'admin',
                            ativo: true,
                            criado_em: new Date().toISOString()
                        });
                    console.log('[CADASTRO] Usuário criado em usuarios_pg');
                } catch (e) {
                    console.warn('[CADASTRO] Erro ao criar em usuarios_pg (pode já existir):', e);
                }

                // 4. VERIFICAR SE É PLANO TESTE GRÁTIS
                if (isPlanoTeste || planoSelecionado === 'Teste') {
                    console.log('[CADASTRO] Plano Teste Grátis - Ativando conta...');

                    // Calcular data de expiração (7 dias)
                    const hoje = new Date();
                    const dataExpiracao = new Date(hoje.getTime() + (7 * 24 * 60 * 60 * 1000)).toISOString();

                    // Ativar cliente imediatamente
                    const { error: updateError } = await supabaseClient
                        .from('clientes_sistema')
                        .update({
                            ativo: true,
                            status_pagamento: 'teste',
                            data_ultimo_pagamento: hoje.toISOString(),
                            data_expiracao: dataExpiracao,
                            plano: 'Teste'
                        })
                        .eq('id', clienteId);

                    if (updateError) {
                        console.error('[CADASTRO] Erro ao ativar teste:', updateError);
                        throw new Error('Erro ao ativar conta de teste');
                    }

                    console.log('[CADASTRO] ✅ Conta de teste ativada! Expira em:', dataExpiracao);

                    // Salvar dados da sessão
                    const dadosSessao = {
                        auth_id: authId,
                        usuario_id: authId,
                        nome: nome,
                        email: email,
                        cliente_id: clienteId,
                        cliente_nome: nome,
                        nivel_acesso: 'admin',
                        ativo: true,
                        login_time: new Date().toISOString()
                    };
                    localStorage.setItem('usuarioLogado', JSON.stringify(dadosSessao));
                    localStorage.setItem('clienteId', clienteId);
                    localStorage.setItem('nivelAcesso', 'admin');

                    // 5. REDIRECIONAR PARA DASHBOARD (sem pagamento)
                    console.log('[CADASTRO] Redirecionando para dashboard...');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // 4. SALVAR DADOS NO SESSION STORAGE PARA PAGAMENTO
                const dadosPagamento = {
                    cliente_id: clienteId,
                    auth_id: authId,
                    nome: nome,
                    email: email,
                    cnpj: cpfCnpj.replace(/\D/g, ''),
                    telefone: telefone,
                    plano: planoSelecionado,
                    valor: valorPlano,
                    asaas_customer_id: clienteData.asaas_customer_id || null
                };

                console.log('[CADASTRO] Salvando dados no sessionStorage:', dadosPagamento);
                sessionStorage.setItem('cadastro_pendente', JSON.stringify(dadosPagamento));

                // 5. REDIRECIONAR PARA PAGAMENTO
                console.log('[CADASTRO] Redirecionando para pagamento...');
                window.location.href = 'pagamento.html';

            } catch (error) {
                console.error('[CADASTRO] Erro:', error);
                mostrarErro('Erro ao criar conta: ' + error.message);
                btn.disabled = false;
                document.getElementById('btn-texto').textContent = 'Criar Conta e Ir para Pagamento';
            }
        }

        // ============================================
        // MOSTRAR STATUS
        // ============================================
        function mostrarStatus(tipo, mensagem) {
            const box = document.getElementById('status-box');
            box.className = 'status-box ' + tipo;
            box.textContent = mensagem;

            setTimeout(() => {
                box.className = 'status-box';
            }, 5000);
        }

        // ============================================
        // MOSTRAR ERRO
        // ============================================
        function mostrarErro(mensagem) {
            console.error('[CADASTRO] Erro:', mensagem);
            document.getElementById('card-form').classList.add('hidden');
            document.getElementById('card-erro').classList.remove('hidden');
            document.getElementById('erro-mensagem').textContent = mensagem;
        }

        function tentarNovamente() {
            document.getElementById('card-erro').classList.add('hidden');
            document.getElementById('card-form').classList.remove('hidden');
            document.getElementById('btn-cadastrar').disabled = false;
            document.getElementById('btn-texto').textContent = 'Criar Conta e Ir para Pagamento';
        }
    </script>
</body>
</html>
