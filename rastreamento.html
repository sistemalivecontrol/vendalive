<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){
    'use strict';
    const SESSAO_KEY='usuarioLogado';
    const LOGIN_PAGE='login.html';
    const path=window.location.pathname.toLowerCase();
    const href=window.location.href.toLowerCase();
    const paginasPublicas=['login.html','solicitacao-entrega.html','solicitacoes.html','solicitacoes1.html','coblive.html','pix-pagamento.html','pix-sucesso.html','links.html','index.html','index2.html'];
    function ehPaginaPublica(){if(path==='/'||path.endsWith('/index.html')||path.endsWith('/index2.html'))return true;for(const p of paginasPublicas){if(path.includes(p)||href.includes(p))return true}return false}
    function verificarSessaoSincrona(){if(ehPaginaPublica())return true;try{const s=localStorage.getItem(SESSAO_KEY);if(!s){window.location.href=LOGIN_PAGE;return false}const d=JSON.parse(s);if(!d||!d.auth_id||!d.usuario_id){localStorage.removeItem(SESSAO_KEY);window.location.href=LOGIN_PAGE;return false}if(d.login_time){const t=new Date(d.login_time).getTime();if((Date.now()-t)>86400000){localStorage.removeItem(SESSAO_KEY);window.location.href=LOGIN_PAGE;return false}}window.sessaoUsuario=d;window.authClienteId=d.cliente_id;return true}catch(e){localStorage.removeItem(SESSAO_KEY);window.location.href=LOGIN_PAGE;return false}}
    verificarSessaoSincrona();
})();
</script>

    <style>

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="btn-voltar" onclick="window.location.href='rastreamento.html'">← Voltar</button>
                <div class="header-center">
                    <h1>📄 Relatorio de Solicitacoes</h1>
                    <p id="subtitulo">Loja e Brecho Pingo de Gente</p>
                </div>
            </div>
            <div>
                <button class="btn-acao btn-pdf" onclick="gerarPDF()">📄 Gerar PDF</button>
                <button class="btn-acao btn-imprimir" onclick="window.print()">🖨️ Imprimir</button>
            </div>
        </div>
        <div class="content">
            <div id="alertContainer"></div>
            <div class="info-relatorio" id="infoPeriodo">
                <strong>Periodo:</strong> <span id="periodoTexto"></span>
            </div>
            <div class="resumo" id="resumoContainer"></div>
            <div class="table-container">
                <table id="tabelaRelatorio">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Nome</th>
                            <th>Instagram</th>
                            <th>Regiao</th>
                            <th>CEP</th>
                            <th>Cidade</th>
                            <th>Observacoes</th>
                            <th>Dados do pacote</th>
                            <th>💳 Pagamento PIX</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyRelatorio"><tr><td colspan="9" class="loading">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        console.log('[REL_SOLICITACOES] v2026-06-04 - Layout simples com PIX');
        let supabaseClient = null;
        let clienteAtual = null;
        let solicitacoes = [];
        let cobrancasCache = {};

        document.addEventListener('DOMContentLoaded', async function() {
            await new Promise(resolve => {
                const check = () => { if (window.supabaseClient) resolve(); else setTimeout(check, 100); };
                check();
            });

            supabaseClient = window.supabaseClient;
            const session = await verificarSessao();
            if (!session) return;

            await carregarUsuarioLogado();
            clienteAtual = window.authClienteId;

            if (!clienteAtual) {
                showAlert('Erro: Cliente nao identificado.', 'error');
                setTimeout(() => { window.location.replace('login.html'); }, 3000);
                return;
            }

            await carregarSolicitacoes();
        });

        async function carregarSolicitacoes() {
            try {
                const idsFromStorage = sessionStorage.getItem('relatorio_ids');
                const filtrosFromStorage = sessionStorage.getItem('relatorio_filtros');

                let query = supabaseClient.from('solicitacoes_pg')
                    .select(`*, cobranca_id, clientes_pg:cliente_pg_id(id, nome, cpf, whatsapp, instagram), enderecos_pg:endereco_id(rua, numero, complemento, bairro, cidade, estado, cep, regiao)`)
                    .eq('cliente_id', clienteAtual);

                if (idsFromStorage) {
                    const ids = JSON.parse(idsFromStorage);
                    if (ids && ids.length > 0) {
                        query = query.in('id', ids);
                    }
                    sessionStorage.removeItem('relatorio_ids');
                }

                let periodoTexto = '';
                if (filtrosFromStorage) {
                    const filtros = JSON.parse(filtrosFromStorage);
                    if (filtros.numero) query = query.ilike('numero_solicitacao', `%${filtros.numero}%`);
                    if (filtros.status) query = query.eq('status', filtros.status);
                    if (filtros.dataInicio) {
                        const d = new Date(filtros.dataInicio + 'T00:00:00').toISOString();
                        query = query.gte('criado_em', d);
                    }
                    if (filtros.dataFim) {
                        const d = new Date(filtros.dataFim + 'T23:59:59').toISOString();
                        query = query.lte('criado_em', d);
                    }
                    sessionStorage.removeItem('relatorio_filtros');

                    periodoTexto = (filtros.dataInicio && filtros.dataFim) 
                        ? `${formatarDataInput(filtros.dataInicio)} a ${formatarDataInput(filtros.dataFim)}`
                        : new Date().toLocaleDateString('pt-BR');
                } else {
                    periodoTexto = new Date().toLocaleDateString('pt-BR');
                }

                document.getElementById('periodoTexto').textContent = periodoTexto;
                query = query.order('criado_em', { ascending: false });

                const { data, error } = await query;
                if (error) throw error;

                solicitacoes = data || [];
                await carregarDadosPix();
                atualizarTabela();
                atualizarResumo();
            } catch (error) {
                showAlert('Erro ao carregar: ' + error.message, 'error');
            }
        }

        async function carregarDadosPix() {
            const cobrancaIds = solicitacoes
                .map(s => s.cobranca_id)
                .filter(id => id && id !== 'null' && id !== 'undefined');

            if (cobrancaIds.length === 0) return;

            try {
                const { data, error } = await supabaseClient
                    .from('cobrancas_pix')
                    .select('id, comprador_nome, valor, status, pago_em, criado_em')
                    .in('id', [...new Set(cobrancaIds)]);

                if (error) throw error;
                cobrancasCache = {};
                (data || []).forEach(c => { cobrancasCache[c.id] = c; });
            } catch (e) {
                console.error('Erro ao carregar PIX:', e);
            }
        }

        function atualizarTabela() {
            const tbody = document.getElementById('tbodyRelatorio');
            if (solicitacoes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-state">Nenhuma solicitacao encontrada</td></tr>`;
                return;
            }

            tbody.innerHTML = solicitacoes.map((s) => {
                const cliente = s.clientes_pg || {};
                const endereco = s.enderecos_pg || {};
                const data = s.criado_em ? new Date(s.criado_em).toLocaleDateString('pt-BR') : '-';

                const dim = [s.altura_cm, s.largura_cm, s.comprimento_cm].filter(Boolean);
                const dadosPacote = [];
                if (s.peso_kg) dadosPacote.push(`Peso: ${s.peso_kg}kg`);
                if (dim.length > 0) dadosPacote.push(`Medidas: ${dim.join('x')}cm`);

                // Dados PIX
                const cobranca = s.cobranca_id ? cobrancasCache[s.cobranca_id] : null;
                let pixHtml = '<span style="color:#999;">-</span>';
                if (cobranca) {
                    const valor = cobranca.valor ? 'R$ ' + parseFloat(cobranca.valor).toFixed(2).replace('.', ',') : '-';
                    const dataPag = cobranca.pago_em ? new Date(cobranca.pago_em).toLocaleDateString('pt-BR') : '-';
                    const horaPag = cobranca.pago_em ? new Date(cobranca.pago_em).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
                    const statusClass = cobranca.status === 'pago' ? 'pix-status-pago' : cobranca.status === 'pendente' ? 'pix-status-pendente' : 'pix-status-cancelado';
                    const statusText = cobranca.status === 'pago' ? 'Pago' : cobranca.status === 'pendente' ? 'Pendente' : cobranca.status;

                    pixHtml = `<div class="pix-valor">${valor}</div><div class="pix-data">${dataPag} ${horaPag ? 'as ' + horaPag : ''}</div><div class="${statusClass}">${statusText}</div>`;
                }

                let nome = cliente.nome || '-';
                if (s.observacoes && s.observacoes.trim()) {
                    nome += '

***Contem Observacoes***';
                }

                return `<tr>
                    <td>${data}</td>
                    <td><strong>${nome.replace(/
/g, '<br>')}</strong></td>
                    <td>${cliente.instagram || '-'}</td>
                    <td>${s.regiao || endereco.regiao || '-'}</td>
                    <td>${formatarCEP(endereco.cep)}</td>
                    <td>${endereco.cidade || '-'}</td>
                    <td style="max-width:150px; font-size:0.8rem;">${s.observacoes || '-'}</td>
                    <td>${dadosPacote.join(' | ') || '-'}</td>
                    <td>${pixHtml}</td>
                </tr>`;
            }).join('');
        }

        function atualizarResumo() {
            const total = solicitacoes.length;
            let totalPix = 0;
            solicitacoes.forEach(s => {
                if (s.cobranca_id && cobrancasCache[s.cobranca_id] && cobrancasCache[s.cobranca_id].status === 'pago') {
                    totalPix += parseFloat(cobrancasCache[s.cobranca_id].valor || 0);
                }
            });
            document.getElementById('resumoContainer').innerHTML = `
                <div class="resumo-item"><strong>Total:</strong> ${total} solicitacoes</div>
                <div class="resumo-item"><strong>PIX Pago:</strong> R$ ${totalPix.toFixed(2).replace('.', ',')}</div>
            `;
        }

        function formatarCEP(cep) { 
            if (!cep) return '-'; 
            cep = cep.toString().replace(/\D/g, ''); 
            return cep.length === 8 ? cep.replace(/(\d{5})(\d{3})/, '$1-$2') : cep; 
        }

        function formatarDataInput(dataString) {
            if (!dataString) return '-';
            const partes = dataString.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // ===== GERAR PDF (layout igual ao antigo do rastreamento) =====
        async function gerarPDF() {
            if (solicitacoes.length === 0) { showAlert('Nao ha solicitacoes para gerar PDF', 'warning'); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            const ordenados = [...solicitacoes].sort((a, b) => {
                const nomeA = ((a.clientes_pg?.nome) || '').toLowerCase();
                const nomeB = ((b.clientes_pg?.nome) || '').toLowerCase();
                return nomeA.localeCompare(nomeB, 'pt-BR');
            });

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text('Loja e Brecho Pingo de Gente - Solicitacoes de Entrega', 15, 15);

            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            const periodo = document.getElementById('periodoTexto').textContent;
            doc.text('Periodo: ' + periodo, 15, 22);

            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.5);
            doc.line(10, 25, 287, 25);

            const dadosTabela = ordenados.map(s => {
                const cliente = s.clientes_pg || {};
                const endereco = s.enderecos_pg || {};
                const dim = [s.altura_cm, s.largura_cm, s.comprimento_cm].filter(Boolean);
                const dadosPacote = [];
                if (s.peso_kg) dadosPacote.push(`Peso: ${s.peso_kg}kg`);
                if (dim.length > 0) dadosPacote.push(`Medidas: ${dim.join('x')}cm`);

                let nome = cliente.nome || '-';
                if (s.observacoes && s.observacoes.trim()) {
                    nome += '

***Contem Observacoes***';
                }

                // Dados PIX
                const cobranca = s.cobranca_id ? cobrancasCache[s.cobranca_id] : null;
                let pixCol = '-';
                if (cobranca) {
                    const valor = cobranca.valor ? 'R$ ' + parseFloat(cobranca.valor).toFixed(2).replace('.', ',') : '-';
                    const dataPag = cobranca.pago_em ? new Date(cobranca.pago_em).toLocaleDateString('pt-BR') : '-';
                    const horaPag = cobranca.pago_em ? new Date(cobranca.pago_em).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
                    pixCol = `${valor}
${dataPag} ${horaPag ? 'as ' + horaPag : ''}
${cobranca.status === 'pago' ? 'Pago' : cobranca.status}`;
                }

                return [
                    s.criado_em ? new Date(s.criado_em).toLocaleDateString('pt-BR') : '-',
                    nome,
                    cliente.instagram || '-',
                    s.regiao || endereco.regiao || '-',
                    formatarCEP(endereco.cep),
                    endereco.cidade || '-',
                    s.observacoes || '-',
                    dadosPacote.join(' | ') || '-',
                    pixCol
                ];
            });

            doc.autoTable({
                head: [['Data', 'Nome', 'Instagram', 'Regiao', 'CEP', 'Cidade', 'Observacoes', 'Dados do pacote', 'Pagamento PIX']],
                body: dadosTabela,
                startY: 30,
                theme: 'grid',
                headStyles: {
                    fillColor: [255, 255, 255],
                    textColor: [0, 0, 0],
                    fontSize: 11,
                    fontStyle: 'bold',
                    lineColor: [0, 0, 0],
                    lineWidth: 0.5,
                    valign: 'middle'
                },
                bodyStyles: {
                    fontSize: 10,
                    textColor: [0, 0, 0],
                    fillColor: [255, 255, 255],
                    minCellHeight: 18,
                    valign: 'top',
                    cellPadding: { top: 4, right: 3, bottom: 4, left: 3 }
                },
                alternateRowStyles: { fillColor: [255, 255, 255] },
                columnStyles: {
                    0: { cellWidth: 25 },
                    1: { cellWidth: 50 },
                    2: { cellWidth: 28 },
                    3: { cellWidth: 30 },
                    4: { cellWidth: 22 },
                    5: { cellWidth: 28 },
                    6: { cellWidth: 35 },
                    7: { cellWidth: 35 },
                    8: { cellWidth: 40 }
                },
                margin: { top: 30, left: 10, right: 10 },
                styles: {
                    lineColor: [0, 0, 0],
                    lineWidth: 0.5,
                    cellPadding: 3,
                    lineHeight: 1.4
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 1) {
                        const text = data.cell.raw;
                        if (text && text.includes('***Contem Observacoes***')) {
                            data.cell.styles.textColor = [220, 20, 60];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                }
            });

            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                doc.text(
                    `Pagina ${i} de ${pageCount} - Total de ${ordenados.length} solicitacoes`,
                    297 / 2, 210 - 10, { align: 'center' }
                );
            }

            const pdfBlobUrl = doc.output('bloburl');
            const novaAba = window.open(pdfBlobUrl, '_blank');
            if (!novaAba) {
                alert('O navegador bloqueou a abertura de nova aba. Por favor, permita popups.');
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
