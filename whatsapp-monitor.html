<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Envios WhatsApp - VendaLive</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0B193F; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }

        .header { background: white; padding: 20px 30px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .btn-voltar { background: linear-gradient(135deg, #0B193F, #1a3a6e); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .btn-voltar:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .header-center h1 { color: #0B193F; font-size: 1.6rem; margin-bottom: 3px; }
        .header-center p { color: #636E72; font-size: 0.85rem; }

        .filters-section { background: #f8f9fa; border-radius: 15px; padding: 25px; margin: 25px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; color: #555; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0B193F; }

        .filter-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; font-size: 0.95rem; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .btn-primary { background: linear-gradient(135deg, #0B193F, #1a3a6e); color: white; }
        .btn-success { background: linear-gradient(135deg, #27ae60, #219a52); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #636E72, #495057); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 0 25px 25px; }
        .stat-card { background: linear-gradient(135deg, #0B193F 0%, #1a3a6e 100%); color: white; padding: 20px; border-radius: 15px; text-align: center; }
        .stat-card h4 { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
        .stat-card .number { font-size: 32px; font-weight: bold; }

        .table-container { overflow-x: auto; margin: 0 25px 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        thead { background: linear-gradient(135deg, #0B193F 0%, #1a3a6e 100%); color: white; }
        th { padding: 12px 10px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9fa; }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: inline-block; }
        .status-enviado { background: #d4edda; color: #155724; }
        .status-timeout { background: #fff3cd; color: #856404; }
        .status-falha { background: #f8d7da; color: #721c24; }
        .status-numero_invalido { background: #f8d7da; color: #721c24; }
        .status-reenviado { background: #d1ecf1; color: #0c5460; }

        .origem-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
        .origem-coblive { background: #E3F2FD; color: #1565C0; }
        .origem-rastreamento { background: #F3E5F5; color: #7B1FA2; }

        /* Botão Reenviar */
        .btn-reenviar {
            background: linear-gradient(135deg, #FF8BA7, #FF6B8A);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-reenviar:hover { transform: scale(1.05); box-shadow: 0 3px 10px rgba(255, 107, 138, 0.4); }
        .btn-reenviar:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-reenviar.reenviando { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .btn-reenviar.sucesso { background: linear-gradient(135deg, #27ae60, #2ecc71); }

        /* Toast */
        .toast-reenvio {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 5000;
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }
        .toast-reenvio.sucesso { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .toast-reenvio.erro { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .toast-reenvio.info { background: linear-gradient(135deg, #3498db, #2980b9); }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .loading { text-align: center; padding: 40px; color: #666; }
        .empty-state { text-align: center; padding: 60px; color: #666; }
        .realtime-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #E8F5E9; border-radius: 20px; font-size: 0.85rem; color: #2E7D32; font-weight: 600; }
        .realtime-dot { width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .user-info { display: flex; align-items: center; gap: 12px; background: #f8f9fa; padding: 10px 18px; border-radius: 12px; border: 1px solid #e9ecef; }
        .btn-logout { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📱%3C/text%3E%3C/svg%3E">
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="btn-voltar" onclick="window.location.href='dashboard.html'">← Voltar</button>
                <div class="header-center">
                    <h1>📱 Monitor de Envios WhatsApp</h1>
                    <p>Acompanhe todos os envios em tempo real</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="realtime-indicator" id="realtimeIndicator">
                    <span class="realtime-dot"></span> Tempo real ativo
                </div>
                <div class="user-info">
                    <span id="userInfo">👤 Carregando...</span>
                    <button class="btn-logout" onclick="window.fazerLogout()">🚪 Sair</button>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h4>Total de Envios</h4><div class="number" id="statTotal">0</div></div>
            <div class="stat-card"><h4>Enviados</h4><div class="number" id="statEnviados">0</div></div>
            <div class="stat-card"><h4>Timeouts</h4><div class="number" id="statTimeouts">0</div></div>
            <div class="stat-card"><h4>Falhas</h4><div class="number" id="statFalhas">0</div></div>
            <div class="stat-card"><h4>Reenviados</h4><div class="number" id="statReenviados">0</div></div>
        </div>

        <div class="filters-section">
            <h3>📅 Filtros</h3>
            <div class="filter-grid">
                <div class="form-group">
                    <label>Data Início</label>
                    <input type="date" id="filtroDataInicio">
                </div>
                <div class="form-group">
                    <label>Data Fim</label>
                    <input type="date" id="filtroDataFim">
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="filtroTipo">
                        <option value="">Todos</option>
                        <option value="pix_cobranca">PIX Cobrança</option>
                        <option value="rastreamento">Rastreamento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="filtroStatus">
                        <option value="">Todos</option>
                        <option value="enviado">Enviado</option>
                        <option value="timeout">Timeout</option>
                        <option value="falha">Falha</option>
                        <option value="numero_invalido">Número Inválido</option>
                        <option value="reenviado">Reenviado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Origem</label>
                    <select id="filtroOrigem">
                        <option value="">Todas</option>
                        <option value="coblive">Cobrança Live</option>
                        <option value="rastreamento">Rastreamento</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Buscar</label>
                    <input type="text" id="filtroBusca" placeholder="Nome ou número...">
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="aplicarFiltros()">🔍 Filtrar</button>
                <button class="btn btn-secondary" onclick="limparFiltros()">🧹 Limpar</button>
                <button class="btn btn-success" onclick="carregarEnvios()">🔄 Atualizar</button>
            </div>
        </div>

        <div class="table-container">
            <table id="tabelaEnvios">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Origem</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Número</th>
                        <th>Cliente</th>
                        <th>Mensagem</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyEnvios">
                    <tr><td colspan="9" class="loading">Carregando envios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Constantes
        const EVOLUTION_API_URL = 'https://evolution-api-o12a.onrender.com';
        const EVOLUTION_API_KEY = '8117861c85b102b1fafd496132bba462';
        const EVOLUTION_INSTANCE = 'pingodegente';
        const TIMEOUT_EVOLUTION = 60000; // 60 segundos

        let supabaseClient = null;
        let clienteSistemaId = null;
        let canalRealtime = null;
        let enviosData = [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', async function() {
            await new Promise(resolve => {
                const check = () => {
                    if (window.supabaseClient) resolve();
                    else setTimeout(check, 100);
                };
                check();
            });

            supabaseClient = window.supabaseClient;
            const session = await verificarSessao();
            if (!session) return;

            await carregarUsuarioLogado();
            clienteSistemaId = window.authClienteId;

            if (!clienteSistemaId) {
                showToast('Erro: Cliente não identificado', 'erro');
                setTimeout(() => window.location.href = 'login.html', 3000);
                return;
            }

            // Definir datas padrão (últimos 7 dias)
            const hoje = new Date();
            const seteDiasAtras = new Date(hoje.getTime() - 7 * 24 * 60 * 60 * 1000);
            document.getElementById('filtroDataFim').value = hoje.toISOString().split('T')[0];
            document.getElementById('filtroDataInicio').value = seteDiasAtras.toISOString().split('T')[0];

            await carregarEnvios();
            iniciarRealtime();
        });

        // Carregar envios do Supabase
        async function carregarEnvios() {
            const tbody = document.getElementById('tbodyEnvios');
            tbody.innerHTML = '<tr><td colspan="9" class="loading">Carregando envios...</td></tr>';

            try {
                let query = supabaseClient
                    .from('whatsapp_envios')
                    .select('*')
                    .eq('cliente_sistema_id', clienteSistemaId)
                    .order('criado_em', { ascending: false });

                // Aplicar filtros
                const dataInicio = document.getElementById('filtroDataInicio').value;
                const dataFim = document.getElementById('filtroDataFim').value;
                const tipo = document.getElementById('filtroTipo').value;
                const status = document.getElementById('filtroStatus').value;
                const origem = document.getElementById('filtroOrigem').value;
                const busca = document.getElementById('filtroBusca').value.trim().toLowerCase();

                if (dataInicio) query = query.gte('criado_em', dataInicio + 'T00:00:00');
                if (dataFim) query = query.lte('criado_em', dataFim + 'T23:59:59');
                if (tipo) query = query.eq('tipo_envio', tipo);
                if (status) query = query.eq('status_envio', status);
                if (origem) query = query.eq('origem', origem);

                const { data, error } = await query.limit(200);

                if (error) throw error;

                enviosData = data || [];

                // Filtro de busca local (nome ou número)
                if (busca) {
                    enviosData = enviosData.filter(e => {
                        const nome = (e.nome_destino || e.destinatario || '').toLowerCase();
                        const numero = (e.numero_destino || e.numero || '').toLowerCase();
                        return nome.includes(busca) || numero.includes(busca);
                    });
                }

                renderizarTabela();
                atualizarEstatisticas();
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="9" class="empty-state">Erro: ${e.message}</td></tr>`;
            }
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tbodyEnvios');

            if (enviosData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state"><div style="font-size: 48px; margin-bottom: 15px;">📭</div><p>Nenhum envio encontrado</p></td></tr>';
                return;
            }

            tbody.innerHTML = enviosData.map(envio => {
                const data = new Date(envio.criado_em).toLocaleString('pt-BR');
                const tipo = envio.tipo_envio || envio.tipo || '-';
                const status = envio.status_envio || envio.status || '-';
                const origem = envio.origem || '-';
                const numero = envio.numero_destino || envio.numero || '-';
                const nome = envio.nome_destino || envio.destinatario || '-';
                const mensagem = envio.mensagem || '-';
                const valor = envio.valor ? 'R$ ' + parseFloat(envio.valor).toFixed(2).replace('.', ',') : '-';

                const statusClass = 'status-' + status;
                const origemClass = 'origem-' + origem;
                const tipoLabel = tipo === 'pix_cobranca' ? '💳 PIX' : (tipo === 'rastreamento' ? '📦 Rastreio' : tipo);
                const origemLabel = origem === 'coblive' ? '💰 COBRANÇA LIVE' : (origem === 'rastreamento' ? '🚚 SOLICITAÇÃO' : origem);

                // Botão reenviar só aparece quando status é timeout
                const btnReenviar = (status === 'timeout') 
                    ? `<button class="btn-reenviar" id="btn-reenviar-${envio.id}" onclick="clickReenviar('${envio.id}', '${numero}', '${mensagem.replace(/'/g, "\'")}', '${tipo}')">🔄 Reenviar</button>`
                    : '';

                return `<tr>
                    <td>${data}</td>
                    <td><span class="origem-badge ${origemClass}">${origemLabel}</span></td>
                    <td>${tipoLabel}</td>
                    <td><span class="status-badge ${statusClass}">${status}</span></td>
                    <td>${numero}</td>
                    <td><strong>${nome}</strong></td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${mensagem}">${mensagem}</td>
                    <td><strong>${valor}</strong></td>
                    <td>${btnReenviar}</td>
                </tr>`;
            }).join('');
        }

        function atualizarEstatisticas() {
            const total = enviosData.length;
            const enviados = enviosData.filter(e => (e.status_envio || e.status) === 'enviado').length;
            const timeouts = enviosData.filter(e => (e.status_envio || e.status) === 'timeout').length;
            const falhas = enviosData.filter(e => ['falha', 'numero_invalido'].includes(e.status_envio || e.status)).length;
            const reenviados = enviosData.filter(e => (e.status_envio || e.status) === 'reenviado').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statEnviados').textContent = enviados;
            document.getElementById('statTimeouts').textContent = timeouts;
            document.getElementById('statFalhas').textContent = falhas;
            document.getElementById('statReenviados').textContent = reenviados;
        }

        // Realtime - atualizações em tempo real
        function iniciarRealtime() {
            canalRealtime = supabaseClient
                .channel('whatsapp_envios_changes')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'whatsapp_envios',
                    filter: `cliente_sistema_id=eq.${clienteSistemaId}`
                }, (payload) => {
                    console.log('[REALTIME] Novo envio detectado:', payload);
                    enviosData.unshift(payload.new);
                    renderizarTabela();
                    atualizarEstatisticas();
                    showToast('📱 Novo envio detectado!', 'info');
                })
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'whatsapp_envios',
                    filter: `cliente_sistema_id=eq.${clienteSistemaId}`
                }, (payload) => {
                    console.log('[REALTIME] Envio atualizado:', payload);
                    const idx = enviosData.findIndex(e => e.id === payload.new.id);
                    if (idx >= 0) {
                        enviosData[idx] = payload.new;
                        renderizarTabela();
                        atualizarEstatisticas();
                    }
                })
                .subscribe((status) => {
                    console.log('[REALTIME] Status:', status);
                    const indicator = document.getElementById('realtimeIndicator');
                    if (status === 'SUBSCRIBED') {
                        indicator.innerHTML = '<span class="realtime-dot"></span> Tempo real ativo';
                        indicator.style.background = '#E8F5E9';
                        indicator.style.color = '#2E7D32';
                    } else {
                        indicator.innerHTML = '⚠️ Reconectando...';
                        indicator.style.background = '#FFF3E0';
                        indicator.style.color = '#E65100';
                    }
                });
        }

        // Botão Reenviar
        async function clickReenviar(logId, numero, mensagem, tipo) {
            const btn = document.getElementById(`btn-reenviar-${logId}`);
            if (!btn || btn.disabled) return;

            btn.disabled = true;
            btn.classList.add('reenviando');
            btn.innerHTML = '⏳ Reenviando...';

            try {
                const resultado = await reenviarWhatsApp(numero, mensagem);

                if (resultado.sucesso) {
                    // Atualizar no banco
                    await supabaseClient
                        .from('whatsapp_envios')
                        .update({ 
                            status_envio: 'reenviado',
                            atualizado_em: new Date().toISOString()
                        })
                        .eq('id', logId);

                    btn.classList.remove('reenviando');
                    btn.classList.add('sucesso');
                    btn.innerHTML = '✅ Reenviado';

                    showToast('✅ Mensagem reenviada com sucesso!', 'sucesso');

                    // Atualizar dados
                    setTimeout(() => carregarEnvios(), 1500);
                } else {
                    btn.disabled = false;
                    btn.classList.remove('reenviando');
                    btn.innerHTML = '🔄 Reenviar';
                    showToast('❌ ' + resultado.mensagem, 'erro');
                }
            } catch (e) {
                btn.disabled = false;
                btn.classList.remove('reenviando');
                btn.innerHTML = '🔄 Reenviar';
                showToast('❌ Erro: ' + e.message, 'erro');
            }
        }

        // Função de reenvio
        async function reenviarWhatsApp(numero, mensagem) {
            let numeroLimpo = numero.replace(/\D/g, '');
            if (!numeroLimpo.startsWith('55')) numeroLimpo = '55' + numeroLimpo;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_EVOLUTION);

                const response = await fetch(`${EVOLUTION_API_URL}/message/sendText/${EVOLUTION_INSTANCE}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': EVOLUTION_API_KEY
                    },
                    body: JSON.stringify({ number: numeroLimpo, text: mensagem }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();

                if (!response.ok) {
                    return { sucesso: false, erro: data.error || 'HTTP ' + response.status, mensagem: 'Erro ao reenviar' };
                }

                return { sucesso: true, mensagem: 'Mensagem reenviada!' };
            } catch (erro) {
                if (erro.name === 'AbortError') {
                    return { sucesso: false, erro: 'Timeout', mensagem: 'Timeout novamente. Tente mais tarde.' };
                }
                return { sucesso: false, erro: erro.message, mensagem: 'Erro: ' + erro.message };
            }
        }

        // Filtros
        function aplicarFiltros() { carregarEnvios(); }
        function limparFiltros() {
            document.getElementById('filtroDataInicio').value = '';
            document.getElementById('filtroDataFim').value = '';
            document.getElementById('filtroTipo').value = '';
            document.getElementById('filtroStatus').value = '';
            document.getElementById('filtroOrigem').value = '';
            document.getElementById('filtroBusca').value = '';
            carregarEnvios();
        }

        // Toast
        function showToast(mensagem, tipo) {
            const anterior = document.querySelector('.toast-reenvio');
            if (anterior) anterior.remove();

            const toast = document.createElement('div');
            toast.className = `toast-reenvio ${tipo}`;
            toast.textContent = mensagem;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
